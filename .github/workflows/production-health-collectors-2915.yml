name: OPS — Production Health Collectors (#2915)

# Zero-cost, read-only signal collectors for #2780 Task 002 (#2915).
#
# Hits a curated set of public, unauthenticated GET endpoints identified as
# monitoring gaps in #2914's service/journey map, and normalizes each result
# into one of five deterministic health states (healthy/degraded/unavailable
# /stale/missing-evidence). Every request is a plain GET — this workflow
# performs no Production write under any code path.
#
# This is the collector/normalization layer only. Operations Issue routing
# and escalation (#2916) is a separate, later work unit and is intentionally
# not wired in here — this workflow currently only fails its own job on a
# detected "unavailable" state, matching this repo's existing pattern of
# advisory-first OPS runtime workflows before escalation wiring is added.

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch: {}

concurrency:
  group: production-health-collectors-2915
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Restore health-check baseline cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/production-health-2915-baseline.json
          key: production-health-2915-baseline-${{ github.run_id }}
          restore-keys: |
            production-health-2915-baseline-

      - name: Run Production health collectors
        id: collect
        run: node scripts/ci/production_health_collectors.mjs

      - name: Save health-check baseline cache
        if: always() && hashFiles('.cache/production-health-2915-baseline.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/production-health-2915-baseline.json
          key: production-health-2915-baseline-${{ github.run_id }}

      - name: Upload collector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health-collectors-2915-result
          path: |
            production-health-collectors-2915-result.json
            production-health-collectors-2915-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('production-health-collectors-2915-result.md') != ''
        run: cat production-health-collectors-2915-result.md >> "$GITHUB_STEP_SUMMARY"

name: OPS — Production Health Collectors & Routing (#2915/#2916)

# Zero-cost, read-only signal collectors (#2780 Task 002, #2915) plus
# deduplicated Operations Issue routing (#2780 Task 003, #2916).
#
# Collectors: hits a curated set of public, unauthenticated GET endpoints
# identified as monitoring gaps in #2914's service/journey map, and
# normalizes each result into one of five deterministic health states
# (healthy/degraded/unavailable/stale/missing-evidence). Every request is a
# plain GET — this workflow performs no Production write under any code
# path.
#
# Routing: for every non-healthy result, creates or updates ONE stable
# per-check Operations Issue (reusing scripts/ci/ops_runtime_escalation.mjs's
# idempotent upsert primitive), and closes that issue with a resolution
# comment the first time the check recovers to healthy. See
# docs/ops/reports/production-monitoring-incident-runbook-2916.md for the
# full incident lifecycle this issue routing feeds into. The routing step
# runs even when the collectors step reports failure (an "unavailable"
# check IS exactly when routing needs to run), and itself performs no
# Production write — its only side effect is GitHub Issues API calls.

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch: {}

concurrency:
  group: production-health-collectors-2915
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Restore health-check baseline cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/production-health-2915-baseline.json
          key: production-health-2915-baseline-${{ github.run_id }}
          restore-keys: |
            production-health-2915-baseline-

      - name: Run Production health collectors
        id: collect
        continue-on-error: true
        run: node scripts/ci/production_health_collectors.mjs

      - name: Run Production health routing
        id: route
        if: always() && hashFiles('production-health-collectors-2915-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_ROUTING_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/production_health_routing.mjs

      - name: Fail the job if any check was unavailable or routing failed
        if: always() && (steps.collect.outcome == 'failure' || steps.route.outcome == 'failure')
        run: exit 1

      - name: Save health-check baseline cache
        if: always() && hashFiles('.cache/production-health-2915-baseline.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/production-health-2915-baseline.json
          key: production-health-2915-baseline-${{ github.run_id }}

      - name: Upload collector and routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health-collectors-2915-result
          path: |
            production-health-collectors-2915-result.json
            production-health-collectors-2915-result.md
            production-health-routing-2916-result.md
          if-no-files-found: warn

      - name: Write collector step summary
        if: always() && hashFiles('production-health-collectors-2915-result.md') != ''
        run: cat production-health-collectors-2915-result.md >> "$GITHUB_STEP_SUMMARY"

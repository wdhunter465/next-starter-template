name: Enforce PR Only Changes

on:
  push:
    branches:
      - main

permissions:
  pull-requests: read

jobs:
  block-direct-push:
    runs-on: ubuntu-latest

    steps:
      - name: Fail if push is not associated with a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The commit-to-PR lookup can lag for a few seconds after a merge,
          # so retry before concluding the push was direct (#4633).
          attempts=6
          delay=5
          pr_number=""
          for attempt in $(seq 1 "$attempts"); do
            pr_number="$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" \
              -H 'Accept: application/vnd.github+json' \
              --jq 'map(select(.merged_at != null))[0].number // ""' || true)"

            if [ -n "$pr_number" ]; then
              echo "Push to main is associated with merged PR #${pr_number} (attempt ${attempt})."
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "No merged PR found for ${GITHUB_SHA} yet (attempt ${attempt}/${attempts}); retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "::error::Direct pushes to main are not allowed. All changes must go through approved PRs."
          exit 1

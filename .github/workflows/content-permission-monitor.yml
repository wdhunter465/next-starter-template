name: OPS — Published Content Permission Monitor

# #4569 / #4528: report-only comparison of published content_inventory stories with D1 permission
# status (scripts/ci/content-permission-monitor-4569.mjs). Runs one fixed read-only SELECT and
# writes the result to the job summary. It never unpublishes, rotates or writes anything, and
# accepts no SQL input.
#
# Manual only. A schedule, and any run against Production (lgfc_lite), need Product Authority's
# explicit Go on #4569 / #4528.

on:
  workflow_dispatch:
    inputs:
      database:
        description: D1 database to read
        type: choice
        options:
          - lgfc-litedev
          - lgfc_lite
        default: lgfc-litedev

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Compare published content with D1 permission status (report only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ inputs.database }}
        run: node --experimental-strip-types scripts/ci/content-permission-monitor-4569.mjs --database "$DATABASE" --remote

name: OPS — Chatterbox Task Ingest (#3415)

# Publishes (idempotently) one or more tasks into an existing Chatterbox
# room's task graph, so registered participants have something concrete to
# claim and discuss. Companion to ops-chatterbox-room-bootstrap.yml, same
# fixed-alias/single-secret pattern.
#
# Default payload seeds the first real multi-agent trial: a single task in
# the lgfc-website room representing the deliverable for #2878
# (PROJECT: Historical Website Open-Source Code Collection and LGFC Reuse
# Mapping, currently pmo:pipeline / pmo:stage:planning) — a design +
# launch packet. One participant claims the task as owner; any registered
# participant may post QUESTION/ANSWER/STATUS events with task_ref set to
# this task_key without claiming it, which is how the actual multi-agent
# discussion happens (see docs/how-to/chatterbox-operate-a-room.md, step 5).
# This workflow does not itself post any discussion events — it only
# publishes the task so the room has something to discuss.
#
# POST /api/chatterbox/tasks is a true upsert (functions/api/chatterbox/
# tasks.ts): re-posting the same room_key+task_key always returns 200 and
# updates title/state/collision_domain/depends_on rather than erroring, so
# this workflow is safe to re-run any number of times, including to update
# an existing task's state as work progresses.
#
# Same triggers, same fixed Preview alias, same CHATTERBOX_PREVIEW_ADMIN_TOKEN
# secret, same fail-closed input validation approach as
# ops-chatterbox-room-bootstrap.yml — never targets Production, never reads
# CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches:
      - component/chatterbox-prototype
    paths:
      - '.github/workflows/ops-chatterbox-task-ingest.yml'
  workflow_dispatch:
    inputs:
      room_key:
        description: 'Existing Chatterbox room_key to publish tasks into'
        required: true
        type: string
        default: lgfc-website
      preview_url:
        description: 'Known Cloudflare Pages Preview URL to target'
        required: true
        type: string
        default: https://component-chatterbox-prototy.next-starter-template-6yr.pages.dev
      tasks_json:
        description: 'JSON array of tasks: task_key, title, state (PLANNED|BLOCKED|AVAILABLE|CLAIMED|IN_PROGRESS|QUESTION|READY_FOR_REVIEW|ACCEPTED|REWORK|COMPLETE|CANCELLED), collision_domain (array), depends_on (array)'
        required: true
        type: string
        default: |
          [
            {
              "task_key": "2878-design-launch-packet",
              "title": "#2878 design + launch packet: Historical Website Open-Source Code Collection and LGFC Reuse Mapping",
              "state": "AVAILABLE",
              "collision_domain": ["docs/ops/reports/2878-design-launch-packet.md"],
              "depends_on": []
            }
          ]

concurrency:
  group: ops-chatterbox-task-ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve room, tasks, and base URL
        id: target
        env:
          DEFAULT_PREVIEW_URL: https://component-chatterbox-prototy.next-starter-template-6yr.pages.dev
          DEFAULT_ROOM_KEY: lgfc-website
          ROOM_KEY_INPUT: ${{ inputs.room_key }}
          PREVIEW_URL_INPUT: ${{ inputs.preview_url }}
          TASKS_JSON_INPUT: ${{ inputs.tasks_json }}
        run: |
          set -euo pipefail

          default_tasks='[
            {
              "task_key": "2878-design-launch-packet",
              "title": "#2878 design + launch packet: Historical Website Open-Source Code Collection and LGFC Reuse Mapping",
              "state": "AVAILABLE",
              "collision_domain": ["docs/ops/reports/2878-design-launch-packet.md"],
              "depends_on": []
            }
          ]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            room_key="$ROOM_KEY_INPUT"
            base_url="$PREVIEW_URL_INPUT"
            tasks_json="$TASKS_JSON_INPUT"
          else
            room_key="$DEFAULT_ROOM_KEY"
            base_url="$DEFAULT_PREVIEW_URL"
            tasks_json="$default_tasks"
          fi

          # Same fail-closed validation posture as
          # ops-chatterbox-room-bootstrap.yml: reject anything that isn't
          # the exact allowed Cloudflare Pages hostname, a plain room_key,
          # or a schema-valid tasks_json — before any request is sent and
          # before any value reaches the result comment posted to #3415.
          if [[ ! "$base_url" =~ ^https://[a-z0-9-]+\.next-starter-template-6yr\.pages\.dev$ ]]; then
            echo "FAIL-CLOSED: preview_url must be an https://*.next-starter-template-6yr.pages.dev host, got: $base_url" >&2
            exit 1
          fi
          if [[ ! "$room_key" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "FAIL-CLOSED: room_key contains unexpected characters: $room_key" >&2
            exit 1
          fi
          if ! echo "$tasks_json" | jq -e '
                type == "array" and length > 0 and all(.[];
                  (.task_key|type=="string") and (.task_key|test("^[A-Za-z0-9._-]+$")) and
                  (.title|type=="string") and (.title|test("\n") | not) and
                  (.state|type=="string") and
                  (.state as $s | ["PLANNED","BLOCKED","AVAILABLE","CLAIMED","IN_PROGRESS","QUESTION","READY_FOR_REVIEW","ACCEPTED","REWORK","COMPLETE","CANCELLED"] | index($s) != null) and
                  ((.collision_domain // []) | type=="array") and
                  ((.depends_on // []) | type=="array")
                )' >/dev/null 2>&1; then
            echo "FAIL-CLOSED: tasks_json must be a non-empty JSON array of objects with task_key (safe charset), title (no newlines), a valid state, and array-typed collision_domain/depends_on" >&2
            exit 1
          fi

          {
            echo "room_key=$room_key"
            echo "base_url=$base_url"
          } >> "$GITHUB_OUTPUT"

          echo "$tasks_json" > "$RUNNER_TEMP/tasks.json"

      - name: Publish tasks
        id: ingest
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          ROOM_KEY: ${{ steps.target.outputs.room_key }}
          ADMIN_TOKEN: ${{ secrets.CHATTERBOX_PREVIEW_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          rows="| task_key | state | result |\n|---|---|---|\n"
          while IFS= read -r t; do
            tkey=$(jq -r '.task_key' <<<"$t")
            state=$(jq -r '.state' <<<"$t")
            payload=$(jq -c --arg room_key "$ROOM_KEY" '. + {room_key: $room_key}' <<<"$t")
            status=$(curl -sS -o "$RUNNER_TEMP/task_resp.json" -w '%{http_code}' \
              -X POST "$BASE_URL/api/chatterbox/tasks" \
              -H "x-admin-token: $ADMIN_TOKEN" -H "Content-Type: application/json" \
              -d "$payload")
            body=$(cat "$RUNNER_TEMP/task_resp.json")
            echo "$tkey -> HTTP $status: $body"
            if [[ "$status" == "200" || "$status" == "201" ]]; then
              result="published"
            else
              echo "FAILED to publish task $tkey (HTTP $status)" >&2
              exit 1
            fi
            rows="${rows}| \`$tkey\` | $state | $result |\n"
          done < <(jq -c '.[]' "$RUNNER_TEMP/tasks.json")

          printf '%b' "$rows" > "$RUNNER_TEMP/task_rows.md"

      - name: Record result on #3415
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROOM_KEY: ${{ steps.target.outputs.room_key }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          if [ -f "$RUNNER_TEMP/task_rows.md" ]; then
            rows=$(cat "$RUNNER_TEMP/task_rows.md")
            body="## Chatterbox task ingest\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTrigger: ${{ github.event_name }}\nRoom: \`$ROOM_KEY\`\nBase URL: \`$BASE_URL\`\n\n$rows\n\nThese tasks are now visible via \`POST /api/chatterbox/check-in\` and \`GET /api/chatterbox/tasks?room=$ROOM_KEY\`. A registered participant claims a task to own its deliverable; any registered participant can post QUESTION/ANSWER/STATUS events with this task_key as task_ref to discuss it without claiming it."
          else
            body="## Chatterbox task ingest — failed\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nSee workflow logs for the failing step. No Production access was attempted regardless of this outcome."
          fi
          gh issue comment 3415 --body "$(printf '%b' "$body")"

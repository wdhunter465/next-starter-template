name: OPS — Chatterbox Development Integration Check (#3415)

# Operator/agent-triggered end-to-end proof against the live Chatterbox
# prototype API, running against Development D1 only — never Production.
#
# Targets the component branch's known, stable Cloudflare Pages Preview
# alias directly (component-chatterbox-prototy.next-starter-template-6yr.
# pages.dev, confirmed against the live Cloudflare dashboard 2026-08-15) —
# it does not call the Cloudflare platform API to resolve it. Per Bill's
# explicit instruction (2026-08-15), this check reads only the
# CHATTERBOX_PREVIEW_ADMIN_TOKEN secret; it does not read CLOUDFLARE_API_TOKEN
# or CLOUDFLARE_ACCOUNT_ID at all, even though those exist in this repo for
# unrelated D1/Pages tooling — nothing else is needed for this testing.
# It exercises the full room/participant/task/claim/event/check-in flow for
# real: atomic claim races, dependency gating, idempotent events, durable
# Q&A, missed-wake recovery, and the system_clerk structural boundary.
#
# Reads ADMIN_TOKEN from the CHATTERBOX_PREVIEW_ADMIN_TOKEN repository
# secret — a dedicated credential Bill provisioned specifically for this
# check (2026-08-15), set as the ADMIN_TOKEN value in Cloudflare Pages'
# Preview environment. Unlike the earlier shared secrets.ADMIN_TOKEN this
# workflow used before, this secret's NAME itself declares its scope: it
# exists only to authenticate against the Preview deployment, never
# Production, closing the name-vs-scope ambiguity flagged in
# docs/ops/reports/delivery-system-preview-isolation-audit.md.
#
# Triggered two ways:
#   - push to component/chatterbox-prototype, scoped to paths that could
#     affect this check's own correctness — this is the only dispatch path
#     available before Project Graduation, since workflow_dispatch requires
#     the workflow file to be registered on the default branch (main),
#     which this file deliberately is not yet (see chatterbox-launch-ready-
#     package-3415.md's "Live dispatch status" section).
#   - workflow_dispatch, for manual re-runs once this file is promoted to
#     main at Graduation. Its preview_url input defaults to the same known
#     alias but can be overridden if Cloudflare's alias for this branch
#     ever changes.

on:
  push:
    branches:
      - component/chatterbox-prototype
    paths:
      - '.github/workflows/chatterbox-dev-integration-check.yml'
      - 'functions/api/chatterbox/**'
      - 'functions/_lib/chatterbox.ts'
      - 'migrations/0046_chatterbox_core.sql'
      - 'scripts/ci/chatterbox_dev_integration_check.mjs'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Component branch to record in the result comment'
        required: true
        type: string
        default: component/chatterbox-prototype
      preview_url:
        description: 'Known Cloudflare Pages Preview URL to test against'
        required: true
        type: string
        default: https://component-chatterbox-prototy.next-starter-template-6yr.pages.dev

concurrency:
  group: chatterbox-dev-integration-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Resolve target branch and base URL
        id: target
        env:
          DEFAULT_PREVIEW_URL: https://component-chatterbox-prototy.next-starter-template-6yr.pages.dev
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"
            echo "base_url=${{ inputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "base_url=$DEFAULT_PREVIEW_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Development integration check
        id: run_check
        env:
          CHATTERBOX_BASE_URL: ${{ steps.target.outputs.base_url }}
          ADMIN_TOKEN: ${{ secrets.CHATTERBOX_PREVIEW_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          node scripts/ci/chatterbox_dev_integration_check.mjs | tee chatterbox-dev-integration-check-result.json

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-dev-integration-check-result
          path: chatterbox-dev-integration-check-result.json
          if-no-files-found: warn

      - name: Record result on #3415
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s chatterbox-dev-integration-check-result.json ]; then
            body="## Chatterbox Development integration check\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTrigger: ${{ github.event_name }}\nTarget branch: \`${{ steps.target.outputs.branch }}\`\nBase URL: \`${{ steps.target.outputs.base_url }}\`\n\n\`\`\`json\n$(cat chatterbox-dev-integration-check-result.json)\n\`\`\`"
          else
            body="## Chatterbox Development integration check — no result produced\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe check did not produce a result file — see workflow logs. No Production access was attempted regardless of this outcome."
          fi
          gh issue comment 3415 --body "$(printf '%b' "$body")"

name: OPS — Chatterbox Development Integration Check (#3794)

# Operator/agent-triggered end-to-end proof against the live Chatterbox API
# on this branch's own Cloudflare Pages Development deployment — never
# Production. Ported forward from the #3415 prototype's
# chatterbox-dev-integration-check.yml, switched to the new Bearer/relay
# auth model (#3794 JULES-1) and extended to exercise the PMO action queue
# (Layer 3), force-release (JULES-5), and the reconciliation sweep
# (Layer 4).
#
# Unlike the prototype branch's version, this workflow does not hardcode a
# known-stable Preview alias — this branch's alias isn't established yet —
# so it resolves the live deployment URL dynamically via
# scripts/ci/chatterbox_resolve_preview_url.mjs (read-only Cloudflare Pages
# API call, the same CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets
# already used by existing D1 tooling in this repo).
#
# Reads the bridge/ops relay credential from the CHATTERBOX_BRIDGE_TOKEN
# repository secret — a dedicated credential distinct from the shared
# ADMIN_TOKEN model the prototype branch used, matching this package's
# per-participant-credential auth design. Never reads
# CHATTERBOX_PREVIEW_ADMIN_TOKEN (the prototype's now-superseded secret).
#
# Triggered two ways:
#   - push to this branch, scoped to paths that could affect this check's
#     own correctness — the only dispatch path available before this
#     workflow is promoted to main, since workflow_dispatch requires the
#     workflow file to be registered on the default branch (Jules #3579
#     JULES-4).
#   - workflow_dispatch, usable once promoted to main.

on:
  push:
    branches:
      - chatterbox-3794-self-hosted-room-actor
    paths:
      - '.github/workflows/chatterbox-dev-integration-check.yml'
      - 'functions/api/chatterbox/**'
      - 'functions/_lib/chatterbox.ts'
      - 'functions/_lib/chatterbox-auth.ts'
      - 'migrations/0050_chatterbox_core.sql'
      - 'migrations/0062_chatterbox_pmo_actions.sql'
      - 'migrations/0063_chatterbox_participant_auth.sql'
      - 'scripts/ci/chatterbox_dev_integration_check.mjs'
      - 'scripts/ci/chatterbox_resolve_preview_url.mjs'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to resolve the live Development deployment for'
        required: true
        type: string
        default: chatterbox-3794-self-hosted-room-actor

concurrency:
  group: chatterbox-dev-integration-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Resolve target branch
        id: target
        env:
          TARGET_BRANCH_INPUT: ${{ inputs.target_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch="$TARGET_BRANCH_INPUT"
          else
            branch="${{ github.ref_name }}"
          fi

          # Fail closed on anything that isn't a plain branch ref — closes a
          # GITHUB_OUTPUT injection path via a crafted dispatch input (same
          # class of hardening the prototype branch's version applied).
          if [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "FAIL-CLOSED: target_branch contains unexpected characters: $branch" >&2
            exit 1
          fi

          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Resolve live Development deployment URL
        id: resolve_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHATTERBOX_TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          base_url=$(node scripts/ci/chatterbox_resolve_preview_url.mjs)
          if [[ ! "$base_url" =~ ^https://[a-z0-9-]+\.next-starter-template-6yr\.pages\.dev$ ]]; then
            echo "FAIL-CLOSED: resolved URL must be an https://*.next-starter-template-6yr.pages.dev host, got: $base_url" >&2
            exit 1
          fi
          printf 'base_url=%s\n' "$base_url" >> "$GITHUB_OUTPUT"

      - name: Run Development integration check
        id: run_check
        env:
          CHATTERBOX_BASE_URL: ${{ steps.resolve_url.outputs.base_url }}
          CHATTERBOX_BRIDGE_TOKEN: ${{ secrets.CHATTERBOX_BRIDGE_TOKEN }}
        run: |
          set -o pipefail
          node scripts/ci/chatterbox_dev_integration_check.mjs | tee chatterbox-dev-integration-check-result.json

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-dev-integration-check-result
          path: chatterbox-dev-integration-check-result.json
          if-no-files-found: warn

      - name: Record result on #3794
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s chatterbox-dev-integration-check-result.json ]; then
            body="## Chatterbox Development integration check\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTrigger: ${{ github.event_name }}\nTarget branch: \`${{ steps.target.outputs.branch }}\`\nBase URL: \`${{ steps.resolve_url.outputs.base_url }}\`\n\n\`\`\`json\n$(cat chatterbox-dev-integration-check-result.json)\n\`\`\`"
          else
            body="## Chatterbox Development integration check — no result produced\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe check did not produce a result file — see workflow logs. No Production access was attempted regardless of this outcome."
          fi
          gh issue comment 3794 --body "$(printf '%b' "$body")"

name: OPS — Secret expiry reminder (#4691)

# Daily read of recorded expiry dates in the asset register. A date inside
# 30 days opens one Operations Issue naming the secret only. No values.
# Product Authority merges this workflow.

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-secret-expiry-watch
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Remind on recorded expiries inside 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ops/secret-expiry-watch.mjs

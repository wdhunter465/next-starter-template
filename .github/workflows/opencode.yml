name: OpenCode Maintenance
on:
  issue_comment:
    types: [created]

permissions:
  id-token: write      # Fixes the OIDC token failure
  contents: write      # Allows the agent to push code
  pull-requests: write # Allows the agent to open PRs
  issues: write        # Allows the agent to reply to your comments

jobs:
  opencode:
    # Only runs if a repository owner, member or collaborator comments /oc.
    # Comments from anyone else (issue_comment fires for any GitHub user on a
    # public repo) never start this job, which holds write permissions and secrets.
    if: >-
      contains(github.event.comment.body, '/oc') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the commit the `latest` tag pointed to on 2026-10-29 (issue #5018).
      # Update deliberately; do not switch back to a moving tag.
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          # Using the standardized identifier for the Hugging Face provider
          model: "Qwen/Qwen2.5-Coder-32B-Instruct"
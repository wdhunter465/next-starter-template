name: OPS — Archive sweep (#5098)

# Manual sweep of archive records approved for deletion (lifecycle state ok_to_delete, waiting period
# passed): writes a tombstone, deletes the Backblaze objects, removes the picture rows and marks the
# record purged. Dry run by default: a dry run plans and reports and deletes nothing. Applying needs
# mode=apply and confirm=confirm, and runs only for the repository owner. Runs only when dispatched.
# Running it against Production needs Product Authority's Go on #5098; start with limit 1.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default, deletes nothing) or apply (deletes from B2 and D1)"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      limit:
        description: "Max records to process in this run (1 to 100)"
        required: false
        default: "1"
      confirm:
        description: 'Type "confirm" to allow apply'
        required: false
        default: ""

concurrency:
  group: ops-archive-sweep-5098
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: >-
      github.repository == 'wdhunter465/next-starter-template' &&
      github.actor == 'wdhunter465'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require confirmation to apply
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "confirm" ]; then
            echo "apply needs confirm=confirm; refusing to run."
            exit 1
          fi
          echo "Mode: $MODE"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare D1 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: lgfc_lite
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Sweep (dry run)
        if: github.event.inputs.mode != 'apply'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWEEP_LIMIT: ${{ github.event.inputs.limit }}
        run: node --experimental-strip-types scripts/ops/archive-sweep.mjs --remote --limit "$SWEEP_LIMIT"

      - name: Sweep (apply)
        if: github.event.inputs.mode == 'apply'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          SWEEP_LIMIT: ${{ github.event.inputs.limit }}
        run: node --experimental-strip-types scripts/ops/archive-sweep.mjs --remote --limit "$SWEEP_LIMIT" --apply

name: OPS — D1 Backup Phase 1 Preflight (#3268)

# Operator-triggered, read-only Production D1 identity/backup-support preflight for #3268
# Phase 1 ("Current-state and security preflight"). Runs `wrangler d1 info` and, best-effort,
# `wrangler d1 time-travel info` against the real database — there is no separate Preview D1
# in this repo (see docs/reference/platform/component-environment-isolation.md), so any D1
# read necessarily targets the same database as Production, same as #2913's precedent.
#
# This workflow performs NO D1 writes, NO export, NO restore, and touches no R2 resource
# (no R2-scoped secret exists in this repository). It does not authorize or perform any
# Production mutation. See scripts/ci/d1_backup_phase1_preflight_3268.mjs for the exact
# read-only operations.
#
# This file (and scripts/ci/d1_backup_phase1_preflight_3268.mjs) matches this repo's
# protected-path patterns in scripts/ci/delivery_profile.mjs, so PRs touching it require
# Approval profile: protected-change-review.

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_preflight:
        description: 'Type "confirm" to run the read-only #3268 Phase 1 D1 preflight'
        required: true
        type: string

concurrency:
  group: d1-backup-phase1-preflight-3268
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm_read_only_preflight }}" != "confirm" ]; then
            echo "confirm_read_only_preflight must be exactly 'confirm' — refusing to run."
            exit 1
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare D1 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Run #3268 Phase 1 read-only D1 preflight
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/ci/d1_backup_phase1_preflight_3268.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-phase1-preflight-3268-result
          path: |
            d1-backup-phase1-preflight-3268-result.json
            d1-backup-phase1-preflight-3268-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('d1-backup-phase1-preflight-3268-result.md') != ''
        run: cat d1-backup-phase1-preflight-3268-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record result on #3268
        if: always() && hashFiles('d1-backup-phase1-preflight-3268-result.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3268 --body-file d1-backup-phase1-preflight-3268-result.md

      - name: Record failure on #3268
        if: failure() && steps.checkout.outcome == 'success' && hashFiles('d1-backup-phase1-preflight-3268-result.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 3268 --body "$(cat <<'EOF'
          <!-- d1-backup-phase1-preflight-3268 -->
          ## #3268 Phase 1 D1 preflight — FAILED (fail-closed)

          The read-only Production D1 identity/backup-support preflight did not complete.
          No write, export, or restore was attempted. See the workflow run logs and uploaded
          artifact (if any) for details.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

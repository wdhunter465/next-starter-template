name: OPS — Certificate and apex redirect (#4688)

# Daily read-only check. A certificate inside 30 days, or an apex response
# that is not a redirect to www, opens one Operations Issue. No DNS or
# Cloudflare change. Product Authority merges this workflow.

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-cert-dns-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check certificates and the apex redirect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ops/cert-dns-watch.mjs

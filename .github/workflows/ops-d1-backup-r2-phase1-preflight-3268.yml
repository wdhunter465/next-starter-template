name: OPS — D1 Backup R2 Phase 1 Preflight (#3268)

# Operator-triggered, read-only R2 backup-bucket investigation preflight for #3268 Phase 1.
# Performs exactly one bounded ListObjectsV2 read (max 1000 keys) against the provisioned
# private R2 bucket using its least-privilege S3 credential, plus a best-effort
# `wrangler r2 bucket list` corroboration using the existing Cloudflare API token.
#
# This workflow performs NO write, upload, delete, or bucket-admin mutation. It does not
# authorize or perform any Production D1 action.
#
# This file (and scripts/ci/d1_backup_r2_phase1_preflight_3268.mjs) matches this repo's
# protected-path patterns in scripts/ci/delivery_profile.mjs, so PRs touching it require
# Approval profile: protected-change-review.

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_preflight:
        description: 'Type "confirm" to run the read-only #3268 R2 Phase 1 preflight'
        required: true
        type: string

concurrency:
  group: d1-backup-r2-phase1-preflight-3268
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm_read_only_preflight }}" != "confirm" ]; then
            echo "confirm_read_only_preflight must be exactly 'confirm' — refusing to run."
            exit 1
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run #3268 R2 Phase 1 read-only preflight
        id: preflight
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/d1_backup_r2_phase1_preflight_3268.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-r2-phase1-preflight-3268-result
          path: |
            d1-backup-r2-phase1-preflight-3268-result.json
            d1-backup-r2-phase1-preflight-3268-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('d1-backup-r2-phase1-preflight-3268-result.md') != ''
        run: cat d1-backup-r2-phase1-preflight-3268-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record result on #3268
        if: always() && hashFiles('d1-backup-r2-phase1-preflight-3268-result.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3268 --body-file d1-backup-r2-phase1-preflight-3268-result.md

      - name: Record failure on #3268
        if: failure() && steps.checkout.outcome == 'success' && hashFiles('d1-backup-r2-phase1-preflight-3268-result.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 3268 --body "$(cat <<'EOF'
          <!-- d1-backup-r2-phase1-preflight-3268 -->
          ## #3268 R2 Phase 1 preflight — FAILED (fail-closed)

          The read-only R2 backup-bucket investigation preflight did not complete. No write,
          upload, or delete was attempted. See the workflow run logs and uploaded artifact
          (if any) for details.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

name: Gehrig Archive Ingest (#4859 / #4861 / #4865)

# Archives the picture files for imported Gehrig discovery candidates in
# Backblaze, on rights hold (Product Authority direction, 2026-10-24, #4839).
# Every file written here starts with media_assets.rights_hold = 1; nothing is
# published and nothing leaves hold without recorded rights evidence and a
# person's release. Each picture is held to the photograph standard (1,500 px
# long side) or the newspaper standard (800 px) and records which standard
# sizes it supports; a picture that cannot be sized is blocked from
# publication (#4861).
#
# Manual only. A schedule is added in a separate PR after the first real batch
# has been inspected. dry_run defaults to true: a dry run resolves and checks
# each candidate but downloads nothing and writes nothing.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates to process in this run"
        required: false
        default: "20"
      dry_run:
        description: "true: check candidates only, write nothing. false: archive to Backblaze and record in production D1"
        required: false
        default: "true"

concurrency:
  group: gehrig-archive-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare D1 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: lgfc_lite
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Archive pictures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          ARCHIVE_LIMIT: ${{ github.event.inputs.limit }}
          ARCHIVE_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          echo "Target database_name=lgfc_lite (Production), limit=${ARCHIVE_LIMIT}, dry_run=${ARCHIVE_DRY_RUN}"
          args=(--database lgfc_lite --remote --limit "${ARCHIVE_LIMIT}")
          if [ "${ARCHIVE_DRY_RUN}" != "false" ]; then
            args+=(--dry-run)
          fi
          node --experimental-strip-types scripts/content-pipeline/archive-ingest.mjs "${args[@]}" | tee archive-ingest.log
          {
            echo "## Gehrig archive ingest"
            echo
            echo "limit=${ARCHIVE_LIMIT}, dry_run=${ARCHIVE_DRY_RUN}"
            echo
            echo '```'
            tail -n 60 archive-ingest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

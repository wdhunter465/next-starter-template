name: Cursor Local Wake Delivery

# RETIRED as an automatic execution path under #3212 Phase 4 (2026-08-09).
# Primary Cursor wake is now `.github/workflows/lgfc-cursor-dispatch.yml`
# on the dedicated `lgfc-cursor` runner.
#
# Approved diagnostic fallback only: trusted manual workflow_dispatch
# (actor `wdhunter645`) may still write a Bridge packet if Product Authority
# explicitly authorizes temporary Bridge diagnostics. Automatic `issues`
# labeled delivery is disabled.
#
# Shared ingress predicate `scripts/cursor-bridge/lib/wake-ingress.mjs` remains
# authoritative for lgfc-cursor-dispatch and must not be deleted.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to deliver a diagnostic wake packet for (PA-approved fallback only)
        required: true
        type: string
      confirmation:
        description: Type CURSOR_WAKE_DIAGNOSTIC to confirm intentional Bridge packet write
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: cursor-local-wake-${{ inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  deliver:
    if: >-
      github.repository == 'wdhunter465/next-starter-template' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'wdhunter645' &&
      inputs.confirmation == 'CURSOR_WAKE_DIAGNOSTIC'
    runs-on: [self-hosted, linux, x64, lgfc-repo-runner]
    timeout-minutes: 5
    steps:
      - name: Confirm diagnostic-only gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$REPOSITORY" = "wdhunter465/next-starter-template"
          test "$EVENT_NAME" = "workflow_dispatch"
          echo "diagnostic_fallback_only=true"
          echo "phase4_bridge_wake_retired=true"

      - name: Resolve issue number
        id: meta
        env:
          ISSUE_FROM_INPUT: ${{ inputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ISSUE="$ISSUE_FROM_INPUT"
          test -n "$ISSUE"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          DELIVERY="wake-${RUN_ID}-${ISSUE}"
          echo "delivery_id=$DELIVERY" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical wake-ingress predicate
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/cursor-bridge/lib/wake-ingress.mjs
          sparse-checkout-cone-mode: false

      - name: Enforce Cursor-only routing before queue write
        env:
          EVENT_NAME: workflow_dispatch
          ISSUE: ${{ steps.meta.outputs.issue }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE_LABELS=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          export ISSUE_LABELS
          node --input-type=module <<'EOF'
          import { shouldDeliverCursorWake } from './scripts/cursor-bridge/lib/wake-ingress.mjs';

          const labels = String(process.env.ISSUE_LABELS || '')
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
          const decision = shouldDeliverCursorWake({
            repository: process.env.REPOSITORY,
            eventName: process.env.EVENT_NAME,
            action: '',
            labelName: '',
            issueLabels: labels,
            actor: process.env.ACTOR || '',
          });
          if (!decision.deliver) {
            console.error(
              `cursor_wake_ingress_reject: ${decision.reason} (issue #${process.env.ISSUE})`,
            );
            process.exit(1);
          }
          console.log(`cursor_routing_ok=true reason=${decision.reason}`);
          EOF

      - name: Write diagnostic wake packet on host
        env:
          ISSUE: ${{ steps.meta.outputs.issue }}
          DELIVERY_ID: ${{ steps.meta.outputs.delivery_id }}
          EVENT_NAME: workflow_dispatch
          ACTOR: ${{ github.actor }}
        run: |
          HOME_DIR="${LGFC_CURSOR_BRIDGE_HOME:-$HOME/lgfc-cursor-bridge}"
          QUEUE="$HOME_DIR/queue"
          mkdir -p "$QUEUE"
          chmod 700 "$HOME_DIR" "$QUEUE" || true
          PACKET="$QUEUE/${DELIVERY_ID}.json"
          export PACKET
          umask 077
          python3 <<'PY'
          import json, os, datetime
          packet = {
            "schemaVersion": 1,
            "issueNumber": int(os.environ["ISSUE"]),
            "deliveryId": os.environ["DELIVERY_ID"],
            "eventName": os.environ["EVENT_NAME"],
            "actor": os.environ.get("ACTOR") or "unknown",
            "deliveredAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "runId": os.environ.get("GITHUB_RUN_ID"),
            "diagnosticFallback": True,
            "retiredPhase": "3212-phase-4",
          }
          path = os.environ["PACKET"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(packet, f, indent=2)
              f.write("\n")
          print(f"Wrote diagnostic wake packet: {path}")
          PY

          # Delivery evidence is local (queue packet + Bridge status). Routine
          # CURSOR BRIDGE ACK Issue comments are prohibited (label/status-driven design).

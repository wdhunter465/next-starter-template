name: LGFC Cursor Runner Health

# Independent offline detection for the lgfc-cursor runner (#3212 Phase 2).
# MUST run on GitHub-hosted ubuntu-latest so a dead Chromebook cannot suppress alarms.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CURSOR_RUNNER_HEALTH to run the check
        required: true
        type: string
      reenable:
        description: Type REENABLE_CURSOR_RUNNER_HEALTH to clear a halt after 3 failures
        required: false
        type: string
  schedule:
    # Two low-noise checks a day (zero incremental cost beyond public Actions minutes).
    # The host usually sleeps overnight, so the 11:17 check is often a notice only;
    # the 17:17 check either clears it or, if still offline, fails the run (#4570).
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"

# GITHUB_TOKEN cannot list self-hosted runners. Do not add permissions.administration
# (#4311): that key is invalid Actions YAML (HTTP 422) and aborts parse on every push.
permissions:
  contents: read
  actions: read

concurrency:
  group: lgfc-cursor-runner-health
  cancel-in-progress: false

jobs:
  health:
    name: Observe lgfc-cursor runner
    if: >-
      github.repository == 'wdhunter465/next-starter-template' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'wdhunter465' &&
          inputs.confirmation == 'CURSOR_RUNNER_HEALTH'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # secrets is not a valid context in step if: (#4408, #4446). Read it into
    # env and branch on env so a missing token still parses and records
    # AUTH_NOT_CONFIGURED instead of failing every push to main.
    env:
      CURSOR_RUNNER_HEALTH_TOKEN: ${{ secrets.CURSOR_RUNNER_HEALTH_TOKEN }}
    steps:
      - name: Record AUTH_NOT_CONFIGURED
        if: env.CURSOR_RUNNER_HEALTH_TOKEN == ''
        run: |
          echo "::notice title=AUTH_NOT_CONFIGURED::CURSOR_RUNNER_HEALTH_TOKEN is not set. ONLINE/OFFLINE not observed. Workflow parsed."

      - name: Query dedicated Cursor runner presence
        id: health
        if: env.CURSOR_RUNNER_HEALTH_TOKEN != ''
        uses: actions/github-script@v7
        env:
          # Read-only lookup of this workflow's previous run (actions: read above).
          ACTIONS_READ_TOKEN: ${{ github.token }}
          OFFLINE_ARTIFACT_NAME: runner-offline-observation
          HALT_ARTIFACT_NAME: runner-health-halted
          REENABLE_ARTIFACT_NAME: runner-health-reenabled
          REENABLE_RUNNER_HEALTH: ${{ inputs.reenable == 'REENABLE_CURSOR_RUNNER_HEALTH' }}
        with:
          github-token: ${{ env.CURSOR_RUNNER_HEALTH_TOKEN }}
          script: |
            const expectedLabel = 'lgfc-cursor';
            const expectedRepo = 'wdhunter465/next-starter-template';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (owner + '/' + repo !== expectedRepo) {
              throw new Error(`Unexpected repository ${owner}/${repo}`);
            }

            const summary = [];
            summary.push('## LGFC Cursor runner health');

            function hasArtifact(list, name) {
              return (list.artifacts || []).some((artifact) => artifact.name === name && !artifact.expired);
            }

            // actions/github-script v7 has no getOctokit binding (#4587). Call the
            // REST API with fetch and GITHUB_TOKEN (actions: read) instead.
            async function githubApi(path) {
              const response = await fetch('https://api.github.com' + path, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: 'Bearer ' + process.env.ACTIONS_READ_TOKEN,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'lgfc-cursor-runner-health',
                },
              });
              let body = {};
              try {
                body = await response.json();
              } catch (parseErr) {
                body = {};
              }
              if (!response.ok) {
                const error = new Error(body.message || `HTTP ${response.status}`);
                error.status = response.status;
                throw error;
              }
              return body;
            }

            const artifactCache = {};
            async function artifactsFor(runId) {
              if (!artifactCache[runId]) {
                artifactCache[runId] = await githubApi(
                  `/repos/${owner}/${repo}/actions/runs/${runId}/artifacts?per_page=100`,
                );
              }
              return artifactCache[runId];
            }

            let historyError = null;
            let runs = [];
            try {
              const listed = await githubApi(
                `/repos/${owner}/${repo}/actions/workflows/lgfc-cursor-runner-health.yml/runs?status=completed&per_page=15`,
              );
              runs = (listed.workflow_runs || []).filter((run) => run.id !== context.runId);
            } catch (err) {
              historyError = err;
            }

            let haltActive = false;
            let consecutiveFailures = 0;
            const failureRuns = [];
            if (!historyError) {
              try {
                for (const run of runs) {
                  const artifacts = await artifactsFor(run.id);
                  if (hasArtifact(artifacts, process.env.REENABLE_ARTIFACT_NAME)) break;
                  if (hasArtifact(artifacts, process.env.HALT_ARTIFACT_NAME)) {
                    haltActive = true;
                    break;
                  }
                  if (run.conclusion === 'failure') {
                    consecutiveFailures += 1;
                    failureRuns.push(run);
                  } else {
                    break;
                  }
                }
              } catch (err) {
                historyError = err;
                haltActive = false;
                consecutiveFailures = 0;
                failureRuns.length = 0;
              }
            }

            const reenableRequested = process.env.REENABLE_RUNNER_HEALTH === 'true';
            if (reenableRequested) {
              core.setOutput('reenabled', 'true');
              haltActive = false;
              consecutiveFailures = 0;
              failureRuns.length = 0;
              summary.push('- Re-enable requested. Failure count starts over.');
            }

            if (haltActive) {
              summary.push('- Result: **HALTED**');
              summary.push('- The check already failed 3 times and will not fail again until a person re-enables it.');
              summary.push('- Re-enable: Actions → LGFC Cursor Runner Health → Run workflow, as wdhunter465, confirmation `CURSOR_RUNNER_HEALTH`, re-enable `REENABLE_CURSOR_RUNNER_HEALTH`.');
              await core.summary.addRaw(summary.join('\n')).write();
              core.notice('LGFC Cursor runner health is halted after 3 consecutive failures.', {
                title: 'RUNNER_HEALTH_HALTED',
              });
              return;
            }

            async function concludeFailure(message) {
              if (consecutiveFailures >= 2) {
                core.setOutput('halt_check', 'true');
                const thirdUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
                const named = [thirdUrl, ...failureRuns.slice(0, 2).map((run) => run.html_url)];
                let createdHaltIssue = false;
                try {
                  const created = await github.rest.issues.create({
                    owner,
                    repo,
                    title: 'OPS EXCEPTION: LGFC Cursor Runner Health halted after 3 consecutive failures',
                    labels: ['team:operations', 'ops-exception'],
                    body: [
                      'The LGFC Cursor Runner Health check failed 3 times in a row and is now halted.',
                      'Further scheduled runs will not fail, and will not open another Issue, until a person re-enables the check.',
                      '',
                      'Failures:',
                      ...named.map((url) => `- ${url}`),
                      '',
                      'Re-enable: Actions → LGFC Cursor Runner Health → Run workflow, as wdhunter465, confirmation `CURSOR_RUNNER_HEALTH`, re-enable `REENABLE_CURSOR_RUNNER_HEALTH`.',
                    ].join('\n'),
                  });
                  summary.push(`- Halt issue: #${created.data.number}`);
                  createdHaltIssue = true;
                } catch (err) {
                  summary.push(`- Halt issue: create failed (${err.status || err.message}). This run still fails once so the workflow-failure watcher can open the single exception Issue.`);
                }
                summary.push('- Result: **HALTED after 3 consecutive failures**');
                summary.push('- Further runs pass until the check is re-enabled.');
                await core.summary.addRaw(summary.join('\n')).write();
                if (createdHaltIssue) {
                  core.notice('LGFC Cursor runner health is halted. One Issue names the failures.', {
                    title: 'RUNNER_HEALTH_HALTED',
                  });
                  return;
                }
                core.setFailed(`${message} Halted after 3 consecutive failures.`);
                return;
              }
              await core.summary.addRaw(summary.join('\n')).write();
              core.setFailed(message);
            }

            let runners;
            try {
              runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                {
                  owner,
                  repo,
                  per_page: 100,
                }
              );
            } catch (err) {
              const status = err.status || err.response?.status;
              if (status === 401 || status === 403) {
                summary.push('- Result: **AUTH_DENIED**');
                summary.push(`- HTTP: ${status}`);
                await concludeFailure(
                  `AUTH_DENIED: health token cannot list self-hosted runners (HTTP ${status})`,
                );
                return;
              }
              throw err;
            }

            const matches = runners.filter((runner) =>
              (runner.labels || []).some((label) => label.name === expectedLabel)
            );

            core.info(`Found ${matches.length} runner(s) with label ${expectedLabel}`);
            for (const runner of matches) {
              core.info(
                `runner name=${runner.name} id=${runner.id} status=${runner.status} busy=${runner.busy}`
              );
            }

            summary.push(`- Label: \`${expectedLabel}\``);
            summary.push(`- Match count: ${matches.length}`);

            if (matches.length === 0) {
              summary.push('- Result: **OFFLINE / UNREGISTERED**');
              summary.push('- Action: register `lgfc-cursor` per docs/how-to/ci/configure-lgfc-cursor-dispatch-runner.md');
              core.warning('No lgfc-cursor runner is registered. Phase 2 host registration incomplete.');
              await concludeFailure('lgfc-cursor runner not registered or not visible via API');
              return;
            }

            const online = matches.filter((runner) => runner.status === 'online');
            if (online.length === 0) {
              // One offline check is usually the Chromebook host asleep (#4567, #4570).
              // Fail only when the previous check of this workflow was also offline.
              summary.push(`- Observed statuses: ${matches.map((r) => r.status).join(', ')}`);

              if (historyError) {
                summary.push(`- Previous check: lookup failed (${historyError.status || historyError.message}); not counted as an offline run`);
                summary.push('- Result: **LOOKUP_FAILED**');
                await core.summary.addRaw(summary.join('\n')).write();
                core.notice(
                  `Previous-run lookup failed (${historyError.status || historyError.message}). This is not an offline result.`,
                  { title: 'RUNNER_HEALTH_LOOKUP_FAILED' },
                );
                return;
              }

              const previous = runs[0];
              let previousOffline = false;
              if (previous) {
                const artifacts = await artifactsFor(previous.id);
                previousOffline = hasArtifact(artifacts, process.env.OFFLINE_ARTIFACT_NAME);
                const line = `Previous check: run ${previous.id} (${previous.created_at}), offline=${previousOffline}`;
                summary.push(`- ${line}`);
                core.info(line);
              }

              core.setOutput('offline_observed', 'true');
              if (previousOffline) {
                summary.push('- Result: **OFFLINE (second consecutive check)**');
                summary.push('- Action: wake the host and confirm the runner service is running; see docs/how-to/ci/configure-lgfc-cursor-dispatch-runner.md');
                await concludeFailure('lgfc-cursor runner is registered but not online on two consecutive checks');
                return;
              }

              summary.push('- Result: **OFFLINE (first observation, notice only)**');
              summary.push('- The next check fails the run if the runner is still offline.');
              await core.summary.addRaw(summary.join('\n')).write();
              core.notice(
                'lgfc-cursor runner is registered but not online. First observation (host likely asleep); the next check fails if it is still offline.',
                { title: 'RUNNER_OFFLINE_NOTICE' },
              );
              return;
            }

            summary.push('- Result: **ONLINE**');
            summary.push(`- Online runners: ${online.map((r) => r.name).join(', ')}`);
            await core.summary.addRaw(summary.join('\n')).write();

      # The next check reads this marker from the previous run to decide notice vs failure.
      - name: Write offline observation marker
        if: always() && steps.health.outputs.offline_observed == 'true'
        run: |
          mkdir -p runner-offline-observation
          date -u +%Y-%m-%dT%H:%M:%SZ > runner-offline-observation/observed-at.txt

      - name: Upload offline observation marker
        if: always() && steps.health.outputs.offline_observed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-offline-observation
          path: runner-offline-observation/
          retention-days: 3

      - name: Write halt marker
        if: always() && steps.health.outputs.halt_check == 'true'
        run: |
          mkdir -p runner-health-halted
          date -u +%Y-%m-%dT%H:%M:%SZ > runner-health-halted/halted-at.txt

      - name: Upload halt marker
        if: always() && steps.health.outputs.halt_check == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-health-halted
          path: runner-health-halted/
          retention-days: 90

      - name: Write re-enable marker
        if: always() && steps.health.outputs.reenabled == 'true'
        run: |
          mkdir -p runner-health-reenabled
          date -u +%Y-%m-%dT%H:%M:%SZ > runner-health-reenabled/reenabled-at.txt

      - name: Upload re-enable marker
        if: always() && steps.health.outputs.reenabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-health-reenabled
          path: runner-health-reenabled/
          retention-days: 90

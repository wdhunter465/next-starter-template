name: Post-Merge Intent Verification

on:
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate (optional)'
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger log
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "## Post-Merge Intent Verification — Trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | \`${EVENT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit SHA | \`${SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | \`${ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | \`${RUN_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run URL | ${RUN_URL} |" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "::notice::Post-Merge Intent Verification triggered — event=${EVENT} sha=${SHA} ref=${REF} actor=${ACTOR} run_id=${RUN_ID}"

      - name: Resolve PR
        id: resolve_pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          SHA: ${{ github.sha }}
        run: |
          PR_NUMBER=""
          RESOLUTION_METHOD=""
          BASE_REF_VALID="n/a"
          MERGED_AT_VALID="n/a"

          if [[ "${EVENT}" == "pull_request_target" ]]; then
            RESOLUTION_METHOD="pull_request_target"
            PR_NUMBER="${EVENT_PR_NUMBER}"
            if [[ "${EVENT_PR_MERGED}" != "true" ]]; then
              echo "PR #${PR_NUMBER} was closed without merging — skipping."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "${EVENT_PR_BASE_REF}" == "main" ]]; then
              BASE_REF_VALID="true"
            else
              BASE_REF_VALID="false"
            fi
            MERGED_AT_VALID="true"
          elif [[ "${EVENT}" == "workflow_dispatch" && -n "${DISPATCH_PR_NUMBER}" ]]; then
            RESOLUTION_METHOD="workflow_dispatch"
            PR_NUMBER="${DISPATCH_PR_NUMBER}"
            BASE_REF_VALID="unchecked"
            MERGED_AT_VALID="unchecked"
          elif [[ "${EVENT}" == "push" ]]; then
            RESOLUTION_METHOD="commit_pulls_api"
            PR_NUMBER=$(gh api --header 'Accept: application/vnd.github+json' "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            if [[ -z "${PR_NUMBER}" ]]; then
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "resolution_method=${RESOLUTION_METHOD}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MERGED_AT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json mergedAt --jq '.mergedAt // empty' 2>/dev/null || true)
            if [[ -n "${MERGED_AT}" ]]; then MERGED_AT_VALID="true"; else MERGED_AT_VALID="false"; fi
            BASE_REF=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json baseRefName --jq '.baseRefName' 2>/dev/null || true)
            if [[ "${BASE_REF}" == "main" ]]; then BASE_REF_VALID="true"; else BASE_REF_VALID="false"; fi
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "resolution_method=${RESOLUTION_METHOD}" >> "$GITHUB_OUTPUT"
          echo "base_ref_valid=${BASE_REF_VALID}" >> "$GITHUB_OUTPUT"
          echo "merged_at_valid=${MERGED_AT_VALID}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## PR Resolution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR Number | \`${PR_NUMBER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resolution Method | \`${RESOLUTION_METHOD}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base Ref Valid | \`${BASE_REF_VALID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merged At Valid | \`${MERGED_AT_VALID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::PR resolved — pr=${PR_NUMBER} method=${RESOLUTION_METHOD} base_ref_valid=${BASE_REF_VALID} merged_at_valid=${MERGED_AT_VALID}"

      - name: Skip summary (no PR resolved)
        if: steps.resolve_pr.outputs.skip == 'true'
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RESOLUTION_METHOD: ${{ steps.resolve_pr.outputs.resolution_method }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## ⏭️ Post-Merge Intent Verification — Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No merged PR could be resolved for this run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | \`${EVENT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit SHA | \`${SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resolution Method Attempted | \`${RESOLUTION_METHOD}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | \`${RUN_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run URL | ${RUN_URL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** Push to \`main\` without a resolvable merged PR — no governance action required for direct pushes unless existing rules mandate otherwise." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Post-Merge Intent Verification skipped — no merged PR resolved for event=${EVENT} sha=${SHA}"

      - name: Comment validation started
        if: steps.resolve_pr.outputs.skip != 'true' && steps.resolve_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve_pr.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="🔍 **Post-Merge Intent Verification started** (run [\`${RUN_ID}\`](${RUN_URL}))

          Validation is in progress for this merged PR. A follow-up comment will report the result."
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${BODY}" || true

      - name: Checkout
        if: steps.resolve_pr.outputs.skip != 'true' && steps.resolve_pr.outputs.pr_number != ''
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate PR body and changed files
        if: steps.resolve_pr.outputs.skip != 'true' && steps.resolve_pr.outputs.pr_number != ''
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve_pr.outputs.pr_number }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          FAILURE_COUNT=0
          MISSING_SECTIONS=""
          MERGE_COMMIT_FOUND="false"

          # Check PR body sections
          PR_BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body // ""' 2>/dev/null || true)
          REQUIRED_SECTIONS=("## Scope" "## Change Summary" "## Verification" "## Acceptance Criteria")
          for SECTION in "${REQUIRED_SECTIONS[@]}"; do
            if echo "${PR_BODY}" | grep -q "${SECTION}"; then
              echo "Section found: ${SECTION}"
            else
              echo "Section missing: ${SECTION}"
              MISSING_SECTIONS="${MISSING_SECTIONS} '${SECTION}'"
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
            fi
          done

          # Check changed files count
          CHANGED_FILES_COUNT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json files --jq '.files | length' 2>/dev/null || echo "0")
          echo "Changed files: ${CHANGED_FILES_COUNT}"

          # Check merge commit
          MERGE_COMMIT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)
          if [[ -n "${MERGE_COMMIT}" ]]; then
            MERGE_COMMIT_FOUND="true"
          fi

          echo "failure_count=${FAILURE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "missing_sections=${MISSING_SECTIONS}" >> "$GITHUB_OUTPUT"
          echo "merge_commit=${MERGE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "merge_commit_found=${MERGE_COMMIT_FOUND}" >> "$GITHUB_OUTPUT"
          echo "changed_files_count=${CHANGED_FILES_COUNT}" >> "$GITHUB_OUTPUT"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Validation Log" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR Body Sections Missing | \`${MISSING_SECTIONS:-none}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Changed Files Checked | \`${CHANGED_FILES_COUNT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merge Commit Found | \`${MERGE_COMMIT_FOUND}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merge Commit | \`${MERGE_COMMIT:-n/a}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failure Count | \`${FAILURE_COUNT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Validation complete — pr=${PR_NUMBER} merge_commit_found=${MERGE_COMMIT_FOUND} changed_files=${CHANGED_FILES_COUNT} failures=${FAILURE_COUNT}"

      - name: Comment pass result
        if: steps.resolve_pr.outputs.skip != 'true' && steps.resolve_pr.outputs.pr_number != '' && steps.validate.conclusion == 'success' && steps.validate.outputs.failure_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve_pr.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_COMMIT: ${{ steps.validate.outputs.merge_commit }}
          FAILURE_COUNT: ${{ steps.validate.outputs.failure_count }}
        run: |
          BODY="✅ **Post-Merge Intent Verification passed** (run [\`${RUN_ID}\`](${RUN_URL}))

          | Field | Value |
          |-------|-------|
          | Result | ✅ Pass |
          | Failure Count | \`${FAILURE_COUNT}\` |
          | Merge Commit | \`${MERGE_COMMIT:-n/a}\` |
          | Run ID | \`${RUN_ID}\` |
          | Run URL | [link](${RUN_URL}) |"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${BODY}" || true

      - name: Comment fail result
        if: steps.resolve_pr.outputs.skip != 'true' && steps.resolve_pr.outputs.pr_number != '' && steps.validate.conclusion == 'success' && steps.validate.outputs.failure_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve_pr.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_COMMIT: ${{ steps.validate.outputs.merge_commit }}
          FAILURE_COUNT: ${{ steps.validate.outputs.failure_count }}
          MISSING_SECTIONS: ${{ steps.validate.outputs.missing_sections }}
        run: |
          BODY="❌ **Post-Merge Intent Verification failed** (run [\`${RUN_ID}\`](${RUN_URL}))

          | Field | Value |
          |-------|-------|
          | Result | ❌ Fail |
          | Failure Count | \`${FAILURE_COUNT}\` |
          | Missing Sections | \`${MISSING_SECTIONS}\` |
          | Merge Commit | \`${MERGE_COMMIT:-n/a}\` |
          | Run ID | \`${RUN_ID}\` |
          | Run URL | [link](${RUN_URL}) |"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${BODY}" || true
# re-trigger

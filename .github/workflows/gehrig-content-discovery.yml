name: Gehrig Content Discovery (#3551 / #3552 / #2270 perpetual collection)

# Two triggers:
#
# - workflow_dispatch: manual, human-triggered ad hoc run. Behavior is
#   unchanged from the original #3551/#3552 design -- production D1 import
#   still requires the human to explicitly set import_to_d1=true and type
#   "confirm".
#
# - schedule: weekly automated run implementing the "perpetual discovery"
#   design intent recorded in #2270 (Phase 7 -- Controlled automation:
#   "scheduled Workers may ... create pending candidates") and #2312
#   (automation may create pending candidates; it must not approve rights,
#   privacy, or publication). A scheduled run always imports discovered
#   candidates into production D1, in the exact same metadata-only,
#   unreviewed shape a manual "confirm" import produces
#   (rights_status=unknown, review_status=pending_review,
#   publication_status=not_ready).
#   content_items has no public read path, so this has zero
#   publication/visibility effect either way. No human types "confirm" for
#   the scheduled path because the recurring schedule itself -- reviewed
#   and merged through normal PR review -- is the standing authorization,
#   scoped to the same #3551-approved automated sources (loc, wikimedia,
#   openverse) and the same small per-run limit as the manual default. A
#   fourth approved source, DPLA, stays manual-opt-in only since it
#   requires a DPLA_API_KEY that isn't configured. A human must still
#   separately record rights_evidence and run the #3567 ingestion endpoint
#   before anything discovered here can become usable media; this workflow
#   never does that and never writes to B2.
#
# To pause scheduled discovery without editing this file: disable the
# workflow from the repo's Actions tab. To change cadence/sources/limit,
# edit the `schedule:` cron and the scheduled-event env values below via PR.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: false
        default: "Lou Gehrig"
      sources:
        description: "Comma-separated sources: openverse,loc,wikimedia"
        required: false
        default: "loc,wikimedia,openverse"
      limit:
        description: "Max results per source"
        required: false
        default: "10"
      import_to_d1:
        description: "Import discovered candidates into production D1 as pending_review content_items (metadata only, no rights conclusion, no publication)"
        required: false
        default: "false"
      confirm_write:
        description: 'Required when import_to_d1 is true: type "confirm" to allow the production D1 write'
        required: false
        default: ""
  schedule:
    # Every Monday 13:00 UTC, against all three #3551-approved automated
    # sources (loc, wikimedia, openverse -- DPLA stays opt-in only since it
    # requires DPLA_API_KEY, not configured here). Weekly matches the
    # zero-recurring-cost / low-volume-first posture in #2270 and #2312 --
    # all three are free public APIs with no meaningful cost or rate risk
    # at this cadence and the existing per-run limit.
    - cron: "0 13 * * 1"

concurrency:
  group: gehrig-content-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run discovery against approved sources
        id: discovery
        env:
          # On schedule, github.event.inputs is entirely absent, so these
          # use the fixed scheduled defaults directly. On workflow_dispatch,
          # this passes github.event.inputs.* through unmodified -- including
          # an intentional empty string -- so manual-dispatch behavior is
          # byte-for-byte unchanged, not silently coerced to a default.
          DISCOVERY_QUERY: ${{ github.event_name == 'schedule' && 'Lou Gehrig' || github.event.inputs.query }}
          DISCOVERY_SOURCES: ${{ github.event_name == 'schedule' && 'loc,wikimedia,openverse' || github.event.inputs.sources }}
          DISCOVERY_LIMIT: ${{ github.event_name == 'schedule' && '10' || github.event.inputs.limit }}
        run: |
          node --experimental-strip-types scripts/content-pipeline/collect-gehrig-external-sources.mjs \
            --query "$DISCOVERY_QUERY" \
            --sources "$DISCOVERY_SOURCES" \
            --limit "$DISCOVERY_LIMIT" \
            --out data/research/lou-gehrig-content-candidates-external-discovery.json

      - name: Write discovery step summary
        if: always()
        run: node scripts/ci/gehrig_discovery_summary.mjs

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: gehrig-discovery-results
          path: |
            data/research/lou-gehrig-content-candidates-external-discovery.json
            data/research/lou-gehrig-content-candidates-external-discovery.search-runs.json
          if-no-files-found: warn

      - name: Require explicit confirmation for production D1 write (manual runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.import_to_d1 == 'true'
        env:
          CONFIRM_WRITE: ${{ github.event.inputs.confirm_write }}
        run: |
          if [ "$CONFIRM_WRITE" != "confirm" ]; then
            echo "import_to_d1 is true but confirm_write != 'confirm' -- refusing to write to production D1."
            exit 1
          fi

      - name: Verify Cloudflare D1 credentials
        if: github.event_name == 'schedule' || github.event.inputs.import_to_d1 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: lgfc_lite
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Import discovered candidates into production D1 (metadata only)
        if: github.event_name == 'schedule' || github.event.inputs.import_to_d1 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Target database_name=lgfc_lite (Production)"
          node --experimental-strip-types scripts/content-pipeline/import-seed-candidates.mjs \
            --file data/research/lou-gehrig-content-candidates-external-discovery.json \
            --database lgfc_lite --remote

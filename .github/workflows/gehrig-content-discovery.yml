name: Gehrig Content Discovery (#3551 / #3552 / #2270 perpetual collection)

# Two triggers:
#
# - workflow_dispatch: manual, human-triggered ad hoc run. Behavior is
#   unchanged from the original #3551/#3552 design -- production D1 import
#   still requires the human to explicitly set import_to_d1=true and type
#   "confirm".
#
# - schedule: weekly automated run implementing the "perpetual discovery"
#   design intent recorded in #2270 (Phase 7 -- Controlled automation:
#   "scheduled Workers may ... create pending candidates") and #2312
#   (automation may create pending candidates; it must not approve rights,
#   privacy, or publication). A scheduled run always imports discovered
#   candidates into production D1, in the exact same metadata-only,
#   unreviewed shape a manual "confirm" import produces
#   (rights_status=unknown, review_status=pending_review,
#   publication_status=not_ready).
#   content_items has no public read path, so this has zero
#   publication/visibility effect either way. No human types "confirm" for
#   the scheduled path because the recurring schedule itself -- reviewed
#   and merged through normal PR review -- is the standing authorization,
#   scoped to the same #3551-approved automated sources (loc, wikimedia,
#   openverse) and the same small per-run limit as the manual default. A
#   fourth approved source, DPLA, stays manual-opt-in only (via
#   workflow_dispatch --sources ...,dpla) even once DPLA_API_KEY is
#   configured -- its adapter has never been verified against DPLA's live
#   API (see functions/_lib/content-pipeline-dpla-adapter.ts), so it is not
#   promoted into the scheduled/manual-dispatch defaults until a human runs
#   and confirms a manual dispatch (#4161). A human must still
#   separately record rights_evidence and run the #3567 ingestion endpoint
#   before anything discovered here can become usable media; this workflow
#   never does that and never writes to B2.
#
# - schedule (hourly, #5225): at minute 17 each hour the run takes one step of the rotating query plan
#   (scripts/content-pipeline/gehrig-discovery-query-plan.json, selected by the UTC hour, so a step that
#   failed or was rate limited comes round again one cycle later). The hourly run COLLECTS and uploads
#   its results as an artifact. It writes to production D1 only when the repository variable
#   GEHRIG_DISCOVERY_HOURLY_IMPORT is set to "true", which Product Authority does after the dry-run
#   result is posted on #5225. The weekly run above is unchanged.
#
# To pause scheduled discovery without editing this file: disable the
# workflow from the repo's Actions tab. To change cadence/sources/limit,
# edit the `schedule:` cron and the scheduled-event env values below via PR.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: false
        default: "Lou Gehrig"
      sources:
        description: "Comma-separated sources: openverse,loc,wikimedia,dpla (dpla requires the DPLA_API_KEY secret and fails fast without it)"
        required: false
        default: "loc,wikimedia,openverse"
      limit:
        description: "Max results per source"
        required: false
        default: "10"
      import_to_d1:
        description: "Import discovered candidates into production D1 as pending_review content_items (metadata only, no rights conclusion, no publication)"
        required: false
        default: "false"
      confirm_write:
        description: 'Required when import_to_d1 is true: type "confirm" to allow the production D1 write'
        required: false
        default: ""
      reenable:
        description: 'Type REENABLE_GEHRIG_DISCOVERY to clear a halt after three consecutive failed runs (#4588)'
        required: false
        default: ""
  schedule:
    # Every Monday 13:00 UTC, against all three #3551-approved automated
    # sources in the default set (loc, wikimedia, openverse -- DPLA stays
    # manual opt-in only regardless of DPLA_API_KEY, see #4161). Weekly
    # matches the
    # zero-recurring-cost / low-volume-first posture in #2270 and #2312 --
    # all three are free public APIs with no meaningful cost or rate risk
    # at this cadence and the existing per-run limit.
    - cron: "0 13 * * 1"
    # Hourly, one query-plan step per run (#5225). Minute 17 avoids the top of the hour.
    - cron: "17 * * * *"

concurrency:
  group: gehrig-content-discovery
  cancel-in-progress: false

# actions: read counts prior runs. issues: write opens the single halt
# Issue after 3 consecutive failures (#4588). There is no shared halt for
# every Action; this covers Gehrig Content Discovery only.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Halt check
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REENABLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reenable || '' }}
        run: node scripts/ci/gehrig_discovery_summary.mjs --guard

      - name: Record re-enable
        if: steps.guard.outputs.reenable == 'true'
        run: |
          mkdir -p gehrig-discovery-reenabled
          date -u +%Y-%m-%dT%H:%M:%SZ > gehrig-discovery-reenabled/reenabled-at.txt

      - name: Upload re-enable marker
        if: steps.guard.outputs.reenable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gehrig-discovery-reenabled
          path: gehrig-discovery-reenabled/
          retention-days: 90

      - name: Install dependencies
        if: steps.guard.outputs.mode != 'halted'
        run: npm ci

      - name: Decide the run mode
        id: mode
        if: steps.guard.outputs.mode != 'halted'
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IMPORT_INPUT: ${{ github.event.inputs.import_to_d1 }}
          HOURLY_IMPORT: ${{ vars.GEHRIG_DISCOVERY_HOURLY_IMPORT }}
        run: |
          hourly=false
          import=false
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "17 * * * *" ]; then
              hourly=true
              if [ "$HOURLY_IMPORT" = "true" ]; then import=true; fi
            else
              import=true
            fi
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$IMPORT_INPUT" = "true" ]; then
            import=true
          fi
          echo "hourly=$hourly" >> "$GITHUB_OUTPUT"
          echo "import=$import" >> "$GITHUB_OUTPUT"
          echo "Run mode: hourly=$hourly, production D1 import=$import" >> "$GITHUB_STEP_SUMMARY"

      - name: Select the hourly query-plan step (#5225)
        id: plan_step
        if: steps.guard.outputs.mode != 'halted' && steps.mode.outputs.hourly == 'true'
        run: node scripts/content-pipeline/discovery-hourly-step.mjs

      - name: Run discovery against approved sources
        if: steps.guard.outputs.mode != 'halted'
        id: discovery
        env:
          # On schedule, github.event.inputs is entirely absent, so these
          # use the fixed scheduled defaults directly. On workflow_dispatch,
          # this passes github.event.inputs.* through unmodified -- including
          # an intentional empty string -- so manual-dispatch behavior is
          # byte-for-byte unchanged, not silently coerced to a default.
          DISCOVERY_QUERY: ${{ github.event_name == 'schedule' && 'Lou Gehrig' || github.event.inputs.query }}
          DISCOVERY_SOURCES: ${{ github.event_name == 'schedule' && 'loc,wikimedia,openverse' || github.event.inputs.sources }}
          DISCOVERY_LIMIT: ${{ github.event_name == 'schedule' && '10' || github.event.inputs.limit }}
          # Threaded through so a manual `--sources ...,dpla` dispatch can
          # authenticate once the DPLA_API_KEY repository secret is
          # registered (#4161). Resolves to an empty string, matching the
          # script's own fail-fast behavior, when the secret isn't set --
          # this line has no effect on any source other than dpla.
          DPLA_API_KEY: ${{ secrets.DPLA_API_KEY }}
          HOURLY: ${{ steps.mode.outputs.hourly }}
          STEP_QUERY: ${{ steps.plan_step.outputs.query }}
          STEP_SOURCE: ${{ steps.plan_step.outputs.source }}
          STEP_PAGE: ${{ steps.plan_step.outputs.page }}
          STEP_DATE_END: ${{ steps.plan_step.outputs.date_end }}
        run: |
          EXTRA=""
          if [ "$HOURLY" = "true" ]; then
            DISCOVERY_QUERY="$STEP_QUERY"
            DISCOVERY_SOURCES="$STEP_SOURCE"
            DISCOVERY_LIMIT="10"
            EXTRA="--page $STEP_PAGE"
            if [ -n "$STEP_DATE_END" ]; then EXTRA="$EXTRA --date-end $STEP_DATE_END"; fi
          fi
          node --experimental-strip-types scripts/content-pipeline/collect-gehrig-external-sources.mjs \
            --query "$DISCOVERY_QUERY" \
            --sources "$DISCOVERY_SOURCES" \
            --limit "$DISCOVERY_LIMIT" \
            $EXTRA \
            --out data/research/lou-gehrig-content-candidates-external-discovery.json

      - name: Write discovery step summary
        if: always() && steps.guard.outputs.mode != 'halted'
        run: node scripts/ci/gehrig_discovery_summary.mjs

      - name: Upload discovery results
        if: steps.guard.outputs.mode != 'halted'
        uses: actions/upload-artifact@v4
        with:
          name: gehrig-discovery-results
          path: |
            data/research/lou-gehrig-content-candidates-external-discovery.json
            data/research/lou-gehrig-content-candidates-external-discovery.search-runs.json
          if-no-files-found: warn

      - name: Require explicit confirmation for production D1 write (manual runs only)
        if: steps.guard.outputs.mode != 'halted' && github.event_name == 'workflow_dispatch' && github.event.inputs.import_to_d1 == 'true'
        env:
          CONFIRM_WRITE: ${{ github.event.inputs.confirm_write }}
        run: |
          if [ "$CONFIRM_WRITE" != "confirm" ]; then
            echo "import_to_d1 is true but confirm_write != 'confirm' -- refusing to write to production D1."
            exit 1
          fi

      - name: Count candidates before import
        id: import_gate
        if: steps.guard.outputs.mode != 'halted' && steps.mode.outputs.import == 'true'
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const file = 'data/research/lou-gehrig-content-candidates-external-discovery.json';
            const count = fs.existsSync(file) ? (JSON.parse(fs.readFileSync(file, 'utf8')).candidates || []).length : 0;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'count=' + count + '\n');
            console.log('candidate_count=' + count);
          "

      - name: Verify Cloudflare D1 credentials
        if: steps.guard.outputs.mode != 'halted' && steps.import_gate.outputs.count != '0' && steps.mode.outputs.import == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: lgfc_lite
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Import discovered candidates into production D1 (metadata only)
        if: steps.guard.outputs.mode != 'halted' && steps.import_gate.outputs.count != '0' && steps.mode.outputs.import == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Target database_name=lgfc_lite (Production)"
          node --experimental-strip-types scripts/content-pipeline/import-seed-candidates.mjs \
            --file data/research/lou-gehrig-content-candidates-external-discovery.json \
            --database lgfc_lite --remote

      - name: Report persistent source outage
        if: always() && steps.guard.outputs.mode != 'halted'
        id: outage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          CONSECUTIVE_PRIOR_FAILURES: ${{ steps.guard.outputs.consecutive_failures }}
        run: node scripts/ci/gehrig_discovery_summary.mjs --outage

      - name: Upload halt marker
        if: always() && steps.outage.outputs.halt_check == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gehrig-discovery-halted
          path: gehrig-discovery-halted/
          retention-days: 90

name: GATE — PR Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve changed files
        id: changed_files
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('files', '');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            core.setOutput('files', files.map((file) => file.filename).join('\n'));

      - name: Write PR hygiene audit inputs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.files }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          printf '%s\n' "$CHANGED_FILES" > "$RUNNER_TEMP/pr_changed_files.txt"

      - name: PR hygiene advisory audit
        id: pr_hygiene_audit
        env:
          PR_HYGIENE_BODY_FILE: ${{ runner.temp }}/pr_body.md
          PR_HYGIENE_CHANGED_FILES_FILE: ${{ runner.temp }}/pr_changed_files.txt
          PR_HYGIENE_RESULT_JSON: ${{ runner.temp }}/pr_hygiene_result.json
          PR_HYGIENE_RESULT_MD: ${{ runner.temp }}/pr_hygiene_result.md
          PR_HYGIENE_ENFORCE_FAILURE: 'false'
        run: node scripts/ci/pr_hygiene_audit.mjs

      - name: Upload PR hygiene artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-hygiene-result-${{ github.event.pull_request.number || github.run_id }}
          path: |
            ${{ runner.temp }}/pr_hygiene_result.json
            ${{ runner.temp }}/pr_hygiene_result.md
          if-no-files-found: ignore

      - name: Upsert PR hygiene advisory comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REMEDIATION_MARKER: '<!-- pr-hygiene-advisory -->'
          REPORT_FILE: ${{ runner.temp }}/pr_hygiene_result.md
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.REMEDIATION_MARKER;
            const report = fs.existsSync(process.env.REPORT_FILE)
              ? fs.readFileSync(process.env.REPORT_FILE, 'utf8').trim()
              : 'PR hygiene audit did not produce a report.';
            const body = `${marker}\n${report}\n\nHard hygiene codes (missing_allowlist, allowlist_violation, unchecked_acceptance_criterion, forbidden_placeholder_token) fail this job closed (#2683). Remaining soft hygiene findings stay advisory and are not branch-protection required.`;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Hygiene gate result
        if: success()
        run: echo "PR hygiene complete (hard codes fail-closed; soft findings advisory)."

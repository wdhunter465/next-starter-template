name: Component Child Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'component/**'
  # GitHub cannot branch-filter pull_request_review at trigger time, so the
  # job-level guard below requires a component/** base before allocating a runner.
  pull_request_review:
    types: [submitted, edited, dismissed]
  # Deterministic settle reevaluation after required peer gates complete.
  # workflow_run also cannot be branch-filtered at trigger time; the job-level
  # guard requires the associated PR payload to target component/**.
  workflow_run:
    workflows:
      - 'GATE — Quality Checks'
      - 'GATE — Diff Scope'
      - 'GATE — Secret Scan'
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  component-child-integration:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       startsWith(github.event.pull_request.base.ref, 'component/')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.draft == false &&
       startsWith(github.event.pull_request.base.ref, 'component/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != null &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number != null &&
       startsWith(github.event.workflow_run.pull_requests[0].base.ref, 'component/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "No component child PR associated with this workflow_run; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "number=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE_REF="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.ref)"
            case "$BASE_REF" in
              component/*) ;;
              *)
                echo "Base ref ${BASE_REF} is not a component branch; skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "number=0" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            case "$BASE_REF" in
              component/*)
                echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Base ref ${BASE_REF} is not a component branch; skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "number=0" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Fetch PR metadata
        id: pr_meta
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          DRAFT="$(jq -r '.draft' "$RUNNER_TEMP/pr.json")"
          if [ "$DRAFT" = "true" ]; then
            echo "PR is draft; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.body' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr_body.md"
          jq -r '.base.ref' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/base_ref.txt"
          jq -r '.head.ref' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/head_ref.txt"
          jq -r '.head.sha' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/head_sha.txt"
          jq -r '.base.sha' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/base_sha.txt"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            | jq -r '.[].filename' > "$RUNNER_TEMP/changed_files.txt"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            | jq -s 'add // []' > "$RUNNER_TEMP/reviews.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --paginate \
            | jq -s 'add // []' > "$RUNNER_TEMP/labels.json"
          # Include timestamps/ids so the evaluator can keep the latest
          # authoritative result per required check name.
          gh api "repos/${GITHUB_REPOSITORY}/commits/$(cat "$RUNNER_TEMP/head_sha.txt")/check-runs" --paginate \
            | jq -s '[.[].check_runs[] | {name, conclusion, status, completed_at, started_at, id}]' \
            > "$RUNNER_TEMP/checks.json"
          {
            echo "base_ref=$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")"
            echo "head_ref=$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")"
            echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve component branch freshness
        id: freshness
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        run: |
          BASE_REF="$(cat "$RUNNER_TEMP/base_ref.txt")"
          BASE_SHA="$(cat "$RUNNER_TEMP/base_sha.txt")"
          git fetch origin "$BASE_REF"
          COMPONENT_HEAD="$(git rev-parse "origin/${BASE_REF}")"
          if [ "$BASE_SHA" = "$COMPONENT_HEAD" ]; then
            echo "behind=0" >> "$GITHUB_OUTPUT"
          else
            BEHIND="$(git rev-list --count "${BASE_SHA}..${COMPONENT_HEAD}")"
            echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          fi
          echo "component_head=${COMPONENT_HEAD}" >> "$GITHUB_OUTPUT"

      - name: Resolve component integration state
        id: component_state
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_REF="$(cat "$RUNNER_TEMP/base_ref.txt")"
          COMPONENT_HEAD="${{ steps.freshness.outputs.component_head }}"
          STATUS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMPONENT_HEAD}/status")"
          STATE="$(echo "$STATUS_JSON" | jq -r '.state')"
          # Hold is never inferred from pending/absent combined status.
          # Explicit hold labels are evaluated in the Node eligibility script.
          case "$STATE" in
            failure|error)
              echo "state=red" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "state=green" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "branch=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "combined_status=${STATE}" >> "$GITHUB_OUTPUT"

      - name: Evaluate component integration eligibility
        id: eligibility
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr_body.md
          PR_BASE_REF: ${{ steps.pr_meta.outputs.base_ref }}
          PR_HEAD_REF: ${{ steps.pr_meta.outputs.head_ref }}
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed_files.txt
          COMPONENT_INTEGRATION_CHECKS_JSON: ${{ runner.temp }}/checks.json
          COMPONENT_INTEGRATION_REVIEWS_JSON: ${{ runner.temp }}/reviews.json
          COMPONENT_INTEGRATION_LABELS_JSON: ${{ runner.temp }}/labels.json
          COMPONENT_INTEGRATION_STATE: ${{ steps.component_state.outputs.state }}
          COMPONENT_INTEGRATION_BASE_BEHIND: ${{ steps.freshness.outputs.behind }}
          COMPONENT_INTEGRATION_HEAD_SHA: ${{ steps.pr_meta.outputs.head_sha }}
          COMPONENT_INTEGRATION_RESULT_JSON: ${{ runner.temp }}/component_integration_result.json
        run: node scripts/ci/component_integration_eligibility.mjs

      - name: Publish component integration check
        if: always() && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
          REQUIRES_CHAT_REVIEW: ${{ steps.eligibility.outputs.requires_chat_review }}
          COMPONENT_STATE: ${{ steps.component_state.outputs.state }}
        run: |
          RESULT_FILE="$RUNNER_TEMP/component_integration_result.json"
          NOT_APPLICABLE="$(jq -r '.notApplicable // false' "$RESULT_FILE")"
          CONCLUSION="failure"
          if [ "$ELIGIBLE" = "true" ]; then
            CONCLUSION="success"
          elif [ "$NOT_APPLICABLE" = "true" ]; then
            # Model A / non-component PRs are out of scope for child auto-integration.
            CONCLUSION="neutral"
          elif [ "$REQUIRES_CHAT_REVIEW" = "true" ]; then
            CONCLUSION="neutral"
          fi
          node --input-type=module -e "
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('${RESULT_FILE}', 'utf8'));
          const lines = [
            'Component integration eligibility: ' + (result.eligible ? 'eligible' : 'blocked'),
            'Component state: ' + process.env.COMPONENT_STATE,
            'Requires Chat review: ' + (result.requiresChatReview ? 'yes' : 'no'),
          ];
          if (result.blockedReasons.length) {
            lines.push('', 'Blocked reasons:');
            for (const reason of result.blockedReasons) {
              lines.push('- ' + reason.code + ': ' + reason.message);
            }
          }
          fs.writeFileSync('${RESULT_FILE}'.replace('.json', '_summary.txt'), lines.join('\n'));
          "
          SUMMARY="$(cat "$RUNNER_TEMP/component_integration_result_summary.txt")"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Component Integration Eligibility' \
            -f head_sha="$(cat "$RUNNER_TEMP/head_sha.txt")" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f output[title]='Component child auto-integration' \
            -f output[summary]="$SUMMARY"

      - name: Enable auto-merge for eligible child PRs
        if: steps.eligibility.outputs.eligible == 'true' && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          ALLOW_AUTO_MERGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"
          if [ "$ALLOW_AUTO_MERGE" != "true" ]; then
            echo "Skipping auto-merge enablement: repository allow_auto_merge=${ALLOW_AUTO_MERGE}."
            exit 0
          fi
          gh api graphql -f query='
            mutation($pullRequestId: ID!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $pullRequestId,
                mergeMethod: SQUASH
              }) {
                pullRequest { autoMergeRequest { enabledAt } }
              }
            }' -f pullRequestId="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .node_id)"

      - name: Upload component integration artifact
        if: always() && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-integration-result-${{ steps.pr.outputs.number || github.run_id }}
          path: ${{ runner.temp }}/component_integration_result.json
          if-no-files-found: ignore

      - name: Integration blocked
        if: steps.eligibility.outputs.eligible != 'true' && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        run: |
          echo "Component child auto-integration is blocked for PR #${{ steps.pr.outputs.number }}."
          exit 0

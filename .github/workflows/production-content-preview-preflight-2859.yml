name: OPS — Production Content Preview D1/B2 Preflight (#2859)

# Operator-triggered, read-only Preview D1/B2 evidence check for #2859, authorized by
# PR #3282 section 9 and carried forward by PR #3330. Produces the Preview half of #2859
# acceptance criterion 7 ("Preview... evidence is recorded"): table presence and row counts
# in the Preview D1 database, and reachability/object-count of the Preview R2/B2 bucket.
#
# This workflow performs NO write of any kind against D1 or R2/B2, and NEVER targets
# Production -- scripts/ci/production_content_preview_preflight_2859.mjs checks the resolved
# database uuid against the known Production database_id (from wrangler.toml) both before and
# after the live `wrangler d1 info` call, and fails closed if they ever match. It does not
# satisfy #2859 criterion 3 (real D1/B2 population) or advance #2780's entry gate by itself.
#
# This file (and scripts/ci/production_content_preview_preflight_2859.mjs) matches this
# repo's protected-path patterns in scripts/ci/delivery_profile.mjs, so the PR that added it
# required Approval profile: protected-change-review, per PR #3282 section 9's own packet.

on:
  workflow_dispatch:
    inputs:
      confirm_preview_preflight:
        description: 'Type "confirm" to run the read-only #2859 Preview D1/B2 preflight'
        required: true
        type: string

concurrency:
  group: production-content-preview-preflight-2859
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm_preview_preflight }}" != "confirm" ]; then
            echo "confirm_preview_preflight must be exactly 'confirm' — refusing to run."
            exit 1
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run #2859 Preview D1/B2 preflight
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_D1_DATABASE_NAME: ${{ secrets.PREVIEW_D1_DATABASE_NAME }}
          PREVIEW_D1_DATABASE_ID: ${{ secrets.PREVIEW_D1_DATABASE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PREVIEW_R2_BUCKET_NAME: ${{ secrets.PREVIEW_R2_BUCKET_NAME }}
        run: node scripts/ci/production_content_preview_preflight_2859.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-content-preview-preflight-2859-result
          path: |
            production-content-preview-preflight-2859-result.json
            production-content-preview-preflight-2859-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('production-content-preview-preflight-2859-result.md') != ''
        run: cat production-content-preview-preflight-2859-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record result on #2859
        if: always() && hashFiles('production-content-preview-preflight-2859-result.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2859 --body-file production-content-preview-preflight-2859-result.md

      - name: Record failure on #2859
        if: failure() && steps.checkout.outcome == 'success' && hashFiles('production-content-preview-preflight-2859-result.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2859 --body "$(cat <<'EOF'
          <!-- production-content-preview-preflight-2859 -->
          ## #2859 Preview D1/B2 preflight — FAILED (fail-closed)

          The read-only Preview D1/B2 preflight did not complete. No write of any kind was
          attempted, and Production D1/R2 were never targeted. See the workflow run logs and
          uploaded artifact (if any) for details -- most likely cause is a missing or
          not-yet-configured PREVIEW_D1_DATABASE_NAME / PREVIEW_D1_DATABASE_ID /
          PREVIEW_R2_BUCKET_NAME repository secret.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

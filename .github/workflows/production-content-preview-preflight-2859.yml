name: OPS — Production Content Preview Evidence Preflight (#2859)

# Operator-triggered, read-only evidence check for #2859, corrected by #3343 after #3341
# established that PR #3282 section 9's original design assumed resources that do not exist:
# this repo's own canonical isolation record (scripts/ci/preview-isolation-manifest.json,
# docs/reference/platform/component-environment-isolation.md) classifies the D1 database as
# `production-shared` -- there is no isolated Preview D1 database to check. This workflow
# therefore does not attempt any D1 check at all (see the script's own header for why that is
# a deliberate design choice, not a gap). It performs exactly one read-only check: Backblaze
# B2 bucket reachability and object count, against this repo's actual B2 integration
# (functions/_lib/b2.ts), which PR #3334's original version incorrectly modeled on Cloudflare
# R2 instead.
#
# This workflow performs NO write of any kind, and does not satisfy #2859 criterion 3 (real
# D1/B2 population) or advance #2780's entry gate by itself.
#
# This file (and scripts/ci/production_content_preview_preflight_2859.mjs) matches this
# repo's protected-path patterns in scripts/ci/delivery_profile.mjs; Model A PRs targeting
# main require Approval profile: work-bill-production regardless of protected-path status.

on:
  workflow_dispatch:
    inputs:
      confirm_preview_preflight:
        description: 'Type "confirm" to run the read-only #2859 Preview evidence preflight'
        required: true
        type: string

concurrency:
  group: production-content-preview-preflight-2859
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm_preview_preflight }}" != "confirm" ]; then
            echo "confirm_preview_preflight must be exactly 'confirm' — refusing to run."
            exit 1
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run #2859 Preview evidence preflight
        id: preflight
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: node scripts/ci/production_content_preview_preflight_2859.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-content-preview-preflight-2859-result
          path: |
            production-content-preview-preflight-2859-result.json
            production-content-preview-preflight-2859-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('production-content-preview-preflight-2859-result.md') != ''
        run: cat production-content-preview-preflight-2859-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record result on #2859
        if: always() && hashFiles('production-content-preview-preflight-2859-result.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2859 --body-file production-content-preview-preflight-2859-result.md

      - name: Record failure on #2859
        if: failure() && steps.checkout.outcome == 'success' && hashFiles('production-content-preview-preflight-2859-result.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2859 --body "$(cat <<'EOF'
          <!-- production-content-preview-preflight-2859 -->
          ## #2859 Preview evidence preflight — FAILED (fail-closed)

          The read-only B2 evidence preflight did not complete. No write of any kind was
          attempted. See the workflow run logs and uploaded artifact (if any) for details --
          most likely cause is a missing B2_ENDPOINT / B2_BUCKET / B2_KEY_ID / B2_APP_KEY
          repository secret.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

name: OPS — Production Content Preview Evidence Preflight (#2859)

# Operator-triggered, read-only evidence check for #2859, updated for the post-#3355/#3360
# Production/Development D1 split (#3337). Production D1 (`lgfc_lite`) and Development/Preview
# D1 (`lgfc-litedev`) are now genuinely separate databases with distinct database_id values
# declared in wrangler.toml -- the earlier #3341/#3343 finding that no isolated Preview D1
# exists is superseded (WORK's 2026-08-11 "DESIGN RECONCILIATION — post-D1 split" on #2859).
#
# This workflow always validates the Production-vs-Preview D1 identity contract from
# wrangler.toml (credential-free) and, when CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID/
# D1_DEV_DATABASE_NAME/D1_DEV_DATABASE_ID are present, additionally runs a live read-only
# table/row-count probe against `lgfc-litedev` only -- the same secret names the accepted
# Prod->Dev refresh workflow (.github/workflows/ops-d1-prod-dev-refresh.yml, #3360) already
# uses in production. It also performs one bounded, read-only Backblaze B2 ListObjectsV2 call
# against this repo's actual B2 integration (functions/_lib/b2.ts).
#
# This workflow performs NO write of any kind, never targets Production D1, and does not
# satisfy #2859 criterion 3 (real D1/B2 population) or advance #2780's entry gate by itself.
#
# This file (and scripts/ci/production_content_preview_preflight_2859.mjs) matches this
# repo's protected-path patterns in scripts/ci/delivery_profile.mjs; Model A PRs targeting
# main require Approval profile: work-bill-production regardless of protected-path status.

on:
  workflow_dispatch:
    inputs:
      confirm_preview_preflight:
        description: 'Type "confirm" to run the read-only #2859 Preview evidence preflight'
        required: true
        type: string

concurrency:
  group: production-content-preview-preflight-2859
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm_preview_preflight }}" != "confirm" ]; then
            echo "confirm_preview_preflight must be exactly 'confirm' — refusing to run."
            exit 1
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run #2859 Preview evidence preflight
        id: preflight
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DEV_DATABASE_NAME: ${{ secrets.D1_DEV_DATABASE_NAME }}
          D1_DEV_DATABASE_ID: ${{ secrets.D1_DEV_DATABASE_ID }}
        run: node scripts/ci/production_content_preview_preflight_2859.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-content-preview-preflight-2859-result
          path: |
            production-content-preview-preflight-2859-result.json
            production-content-preview-preflight-2859-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('production-content-preview-preflight-2859-result.md') != ''
        run: cat production-content-preview-preflight-2859-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record result on #2859
        if: always() && hashFiles('production-content-preview-preflight-2859-result.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2859 --body-file production-content-preview-preflight-2859-result.md

      - name: Record failure on #2859
        if: failure() && steps.checkout.outcome == 'success' && hashFiles('production-content-preview-preflight-2859-result.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2859 --body "$(cat <<'EOF'
          <!-- production-content-preview-preflight-2859 -->
          ## #2859 Preview evidence preflight — FAILED (fail-closed)

          The read-only D1 identity contract / B2 evidence preflight did not complete. No
          write of any kind was attempted, and Production D1 was never targeted. See the
          workflow run logs and uploaded artifact (if any) for details -- most likely cause
          is a missing B2_ENDPOINT / B2_BUCKET / B2_KEY_ID / B2_APP_KEY repository secret, or
          a wrangler.toml Production/Preview D1 identity contract failure.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

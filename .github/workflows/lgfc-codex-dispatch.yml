name: LGFC Codex Dispatch

# Independent Codex wake path. Cursor dispatch configuration is intentionally untouched.
# Only identifiers cross the workflow/runner boundary; public text is never executed.
on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  workflow_run:
    types: [completed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Source Issue number to wake Codex for
        required: true
        type: string
      confirmation:
        description: Type CODEX_DISPATCH to confirm trusted manual wake
        required: true
        type: string
      dry_run:
        description: Run wrapper preflight only
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: lgfc-codex-dispatch
  cancel-in-progress: false

jobs:
  security_unit_tests:
    name: Codex dispatch security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lgfc-codex-dispatch/test-dispatch-security.mjs

  dispatch:
    name: Dispatch Codex wake
    needs: security_unit_tests
    if: >-
      github.repository == 'wdhunter465/next-starter-template' &&
      ((github.event_name == 'issues' && github.event.action == 'labeled' &&
        contains(join(github.event.issue.labels.*.name, ','), 'agent:codex') &&
        contains(join(github.event.issue.labels.*.name, ','), 'handoff:ready')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        github.actor == 'wdhunter645' && inputs.confirmation == 'CODEX_DISPATCH') ||
       (github.event_name == 'pull_request_review' &&
        contains(join(github.event.pull_request.labels.*.name, ','), 'agent:codex')) ||
       (github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        contains(join(github.event.pull_request.labels.*.name, ','), 'agent:codex')))
    runs-on: [self-hosted, linux, x64, lgfc-codex]
    timeout-minutes: 30
    steps:
      - name: Resolve identifiers only
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_EVENT: ${{ github.event.issue.number }}
          ISSUE_INPUT: ${{ inputs.issue_number }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          WORKFLOW_PR_EVENT: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.run_id }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ISSUE="${ISSUE_EVENT:-${PR_EVENT:-${WORKFLOW_PR_EVENT:-${ISSUE_INPUT:-}}}}"
          case "$ISSUE" in ''|*[!0-9]*) echo 'invalid issue identifier'; exit 1;; esac
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "delivery_id=wake-${RUN_ID}-${ISSUE}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN_INPUT:-false}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Invoke fixed local Codex wrapper
        env:
          ISSUE: ${{ steps.meta.outputs.issue }}
          DELIVERY_ID: ${{ steps.meta.outputs.delivery_id }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node scripts/lgfc-codex-dispatch/dispatch.mjs \
            --repo wdhunter465/next-starter-template --issue "$ISSUE" \
            --event "$EVENT_NAME" --delivery-id "$DELIVERY_ID" --run-id "$RUN_ID" \
            --workspace "$GITHUB_WORKSPACE" $(if [ "$DRY_RUN" = true ]; then echo --dry-run true; fi)

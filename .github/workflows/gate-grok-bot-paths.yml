name: GATE — Grok Bot documentation paths

# #5378. A Grok Bot pull request (branch prefix `grok-bot/`) may contain documentation
# files only and may not write to the excluded documents. Report-only until Product
# Authority sets the repository variable GROK_BOT_PATH_GATE_ENFORCE to `true` AND adds
# this check to the required list (a branch-protection change that needs his explicit Go).
#
# The script is read from the BASE commit, so a pull request cannot edit the gate that
# judges it. The head ref is passed through the environment, never inlined into a shell.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  grok-bot-path-gate:
    if: startsWith(github.event.pull_request.head.ref, 'grok-bot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted gate script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::Grok Bot path gate needs a numeric PR number."
              exit 1
              ;;
          esac
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed_files.txt"

      - name: Grok Bot path gate
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed_files.txt
          GROK_BOT_PATH_GATE_ENFORCE: ${{ vars.GROK_BOT_PATH_GATE_ENFORCE || 'false' }}
        run: node scripts/ci/grok_bot_path_gate.mjs

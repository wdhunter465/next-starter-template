name: GATE — Reviewer Response Completion

on:
  pull_request:
    # Keep push/open/reopen advisory so asynchronous reviewers cannot deadlock
    # ordinary implementation. Merge-readiness events remain enforcing.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true

# #3746: cancel superseded runs for the same PR so the latest trusted-review
# event owns the required check; prevents stale green from racing merge.
concurrency:
  group: reviewer-response-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  reviewer-response-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide enforce vs advisory posture
        id: posture
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          ENFORCE="false"
          case "${EVENT_NAME}" in
            pull_request_review|pull_request_review_comment|workflow_dispatch)
              ENFORCE="true"
              ;;
            pull_request)
              case "${EVENT_ACTION}" in
                ready_for_review|edited)
                  ENFORCE="true"
                  ;;
                opened|synchronize|reopened)
                  ENFORCE="false"
                  ;;
                *)
                  ENFORCE="false"
                  ;;
              esac
              ;;
            *)
              ENFORCE="false"
              ;;
          esac
          echo "enforce_failure=${ENFORCE}" >> "${GITHUB_OUTPUT}"
          echo "Reviewer lifecycle posture: event=${EVENT_NAME} action=${EVENT_ACTION:-n/a} enforce=${ENFORCE}"

      - name: Scaffold reviewer response accounting
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # The runner itself independently refuses forks/closed PRs. A neutral
          # event value lets this pull_request workflow reuse the existing repair
          # engine without weakening its same-repository safety boundary.
          GITHUB_EVENT_NAME: ""
        run: node scripts/ci/run_pr_body_auto_repair.mjs

      - name: Reviewer lifecycle disposition audit
        id: reviewer_lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # #3281: do not hard-fail every synchronize while async reviewers are
          # still arriving. Enforcing events below are merge-readiness checks.
          ENFORCE_FAILURE: ${{ steps.posture.outputs.enforce_failure }}
          REVIEWER_LIFECYCLE_RESULT_JSON: ${{ runner.temp }}/reviewer_lifecycle_result.json
          REVIEWER_LIFECYCLE_RESULT_MD: ${{ runner.temp }}/reviewer_lifecycle_result.md
        run: node scripts/ci/reviewer_lifecycle_gate.mjs

      - name: Review settle quiet period (enforcing only)
        if: steps.posture.outputs.enforce_failure == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # Evidence-based bound from #3746 latency sample (90s; clamp 15–120s).
          REVIEW_SETTLE_MS: "90000"
          REVIEWER_LIFECYCLE_RESULT_JSON: ${{ runner.temp }}/reviewer_lifecycle_result.json
        run: node scripts/ci/run_review_settle.mjs

      - name: Hand blocked PR back to preparer
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ENFORCE_FAILURE: ${{ steps.posture.outputs.enforce_failure }}
          REVIEWER_LIFECYCLE_RESULT_JSON: ${{ runner.temp }}/reviewer_lifecycle_result.json
        run: node scripts/ci/reviewer_preparer_handback.mjs

      - name: Upload reviewer lifecycle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-lifecycle-result-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: |
            ${{ runner.temp }}/reviewer_lifecycle_result.json
            ${{ runner.temp }}/reviewer_lifecycle_result.md
          if-no-files-found: ignore

      - name: Reviewer disposition gate complete
        if: success()
        env:
          ENFORCE: ${{ steps.posture.outputs.enforce_failure }}
        run: |
          if [ "${ENFORCE}" = "true" ]; then
            echo "Reviewer lifecycle disposition check passed (enforcing)."
          else
            echo "Reviewer lifecycle disposition check passed (advisory on this event)."
          fi

name: GATE — Reviewer Response Completion

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  reviewer-response-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reviewer lifecycle disposition audit
        id: reviewer_lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # #2683 rec 2: fail closed on undispositioned / outdated-without-disposition findings
          ENFORCE_FAILURE: 'true'
          REVIEWER_LIFECYCLE_RESULT_JSON: ${{ runner.temp }}/reviewer_lifecycle_result.json
          REVIEWER_LIFECYCLE_RESULT_MD: ${{ runner.temp }}/reviewer_lifecycle_result.md
        run: node scripts/ci/reviewer_lifecycle_gate.mjs

      - name: Upload reviewer lifecycle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-lifecycle-result-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: |
            ${{ runner.temp }}/reviewer_lifecycle_result.json
            ${{ runner.temp }}/reviewer_lifecycle_result.md
          if-no-files-found: ignore

      - name: Reviewer disposition gate complete
        if: success()
        run: echo "Reviewer lifecycle disposition check passed (enforcing undispositioned and outdated-without-disposition)."

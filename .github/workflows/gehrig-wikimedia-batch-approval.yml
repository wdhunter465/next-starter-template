name: Gehrig Wikimedia Batch Approval + Ingestion (#3551 / #3552)

# Operator-triggered production write path for the 10 Wikimedia Commons
# candidates Bill reviewed and approved on 2026-08-17 (real license/caption/
# credit/date data surfaced by gehrig-content-discovery.yml run 32066959698,
# frozen into data/research/lou-gehrig-wikimedia-approved-batch-2026-08-17.json
# so this workflow always operates on exactly what was reviewed, not a fresh
# live re-scrape). Writes to Production D1 (content_items, rights_evidence,
# media_assets) and Production B2. Never records a rights conclusion itself
# -- record-batch-rights-approval.mjs only classifies each item's
# already-approved Commons license template into the fixed
# rights_evidence.conclusion vocabulary; the approval decision and reviewer
# identity ("Bill Hunter") come from the human direction that produced the
# checked-in fixture, per #3551's core safety rule.
#
# Three sequential steps, all idempotent (ON CONFLICT / INSERT OR IGNORE /
# UPDATE ... WHERE candidate_id):
#   1. Import the 10 candidates into content_items.
#   2. Record rights_evidence + curator_decision for each.
#   3. Fetch each file from its real Commons upload.wikimedia.org URL
#      (resolved live via the Commons API from the file title), validate it,
#      write it to B2 under the LGFC_ prefix, and link media_asset_id.

on:
  workflow_dispatch:
    inputs:
      confirm_write:
        description: 'Type "confirm" to run this workflow at all (it always writes to Production D1/B2 when confirm_write matches)'
        required: true
        type: string

concurrency:
  group: gehrig-wikimedia-batch-approval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  approve-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM_WRITE: ${{ github.event.inputs.confirm_write }}
        run: |
          if [ "$CONFIRM_WRITE" != "confirm" ]; then
            echo "confirm_write must be exactly 'confirm' -- refusing to write to Production D1/B2."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare D1 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: lgfc_lite
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Import the 10 approved candidates into content_items
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types scripts/content-pipeline/import-seed-candidates.mjs \
            --file data/research/lou-gehrig-wikimedia-approved-batch-2026-08-17.json \
            --database lgfc_lite --remote

      - name: Record rights_evidence + curator_decision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types scripts/content-pipeline/record-batch-rights-approval.mjs \
            --candidates data/research/lou-gehrig-wikimedia-approved-batch-2026-08-17.json \
            --license-notes data/research/lou-gehrig-wikimedia-approved-batch-2026-08-17.license-notes.json \
            --reviewer "Bill Hunter" \
            --database lgfc_lite --remote

      - name: Fetch, validate, and ingest each file into B2
        id: ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          node --experimental-strip-types scripts/content-pipeline/ingest-batch.mjs \
            --candidates data/research/lou-gehrig-wikimedia-approved-batch-2026-08-17.json \
            --database lgfc_lite --remote

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Gehrig Wikimedia Batch Approval + Ingestion (#3551 / #3552)"
            echo ""
            echo "Imported, approved (reviewer: Bill Hunter), and ingested the 10 Wikimedia Commons"
            echo "candidates from data/research/lou-gehrig-wikimedia-approved-batch-2026-08-17.json."
            echo ""
            echo "Ingestion step outcome: ${{ steps.ingest.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

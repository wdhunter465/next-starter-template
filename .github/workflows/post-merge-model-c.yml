name: Post-Merge Model C Verification

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to verify
        required: true
        type: string

jobs:
  model-c-post-merge:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          PULL_REQUEST_MERGED: ${{ github.event.pull_request.merged }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$PULL_REQUEST_NUMBER"
            printf '%s\n' "$PULL_REQUEST_BODY" > "$RUNNER_TEMP/pr_body.md"
            MERGED="$PULL_REQUEST_MERGED"
          else
            PR_NUMBER="$DISPATCH_PR_NUMBER"
            gh pr view "$PR_NUMBER" --json body -q .body > "$RUNNER_TEMP/pr_body.md"
            MERGED=$(gh pr view "$PR_NUMBER" --json merged -q .merged)
          fi
          if grep -qiE '^[[:space:]]*(-[[:space:]]*)?Delivery model:[[:space:]]*C[[:space:]]*$' "$RUNNER_TEMP/pr_body.md"; then
            echo "is_model_c=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_model_c=false" >> "$GITHUB_OUTPUT"
          fi
          ISSUE_CLOSED=""
          ISSUE_NUM=$(grep -oiE '\*\*Issue:\*\*[[:space:]]*#[0-9]+' "$RUNNER_TEMP/pr_body.md" | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(grep -oiE 'Issue:[[:space:]]*#[0-9]+' "$RUNNER_TEMP/pr_body.md" | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [ -n "$ISSUE_NUM" ]; then
            STATE=$(gh issue view "$ISSUE_NUM" --json state -q .state 2>/dev/null || echo "")
            if [ "$STATE" = "CLOSED" ]; then
              ISSUE_CLOSED="true"
            elif [ "$STATE" = "OPEN" ]; then
              ISSUE_CLOSED="false"
            fi
          fi
          echo "issue_closed=$ISSUE_CLOSED" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

      - name: Collect merge paths
        if: steps.meta.outputs.is_model_c == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::Model C changed-file evidence requires a numeric PR number."
              exit 1
              ;;
          esac
          if ! gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed_files.txt"; then
            echo "::error::Model C changed-file evidence is unavailable for PR #$PR_NUMBER (GitHub API request failed)."
            exit 1
          fi
          if ! test -s "$RUNNER_TEMP/changed_files.txt"; then
            echo "::error::Model C changed-file evidence is unavailable for PR #$PR_NUMBER."
            exit 1
          fi
          cat "$RUNNER_TEMP/changed_files.txt"
      - name: Lightweight Model C post-merge check
        if: steps.meta.outputs.is_model_c == 'true'
        env:
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed_files.txt
          MODEL_C_PR_MERGED: ${{ steps.meta.outputs.merged }}
          MODEL_C_ISSUE_CLOSED: ${{ steps.meta.outputs.issue_closed }}
        run: node scripts/ci/model_c_post_merge.mjs

      - name: Skip non-Model C merges
        if: steps.meta.outputs.is_model_c != 'true'
        run: echo "Merged PR did not claim Model C; post-merge Model C verification skipped."

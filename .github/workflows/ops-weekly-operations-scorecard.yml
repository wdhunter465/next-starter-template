name: OPS — Weekly operations scorecard

# Read-only weekly scorecard (#4599). Writes a job summary and one comment on
# the standing "Weekly scorecard" Issue. GITHUB_TOKEN only; no Production access.

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: ops-weekly-operations-scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish the weekly scorecard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ops/weekly-operations-scorecard.mjs --publish

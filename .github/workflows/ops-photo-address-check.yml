name: OPS — Photo Address Check

# Samples the photo addresses the live public pages and APIs serve and confirms each returns an
# image from Backblaze (#4683, monitoring gap 3). A failure opens or updates one Operations
# Issue. Public URLs only; GITHUB_TOKEN only. Read-only: no database access, no member data.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-photo-address-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check photo addresses
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_ESCALATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ops/photo-address-check.mjs --escalate

name: OPS — B2 D1 Daily Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no D1/B2 writes) -- for verifying changes before they run for-real on schedule"
        type: boolean
        default: false
  schedule:
    # 04:00 America/New_York (EST) = 09:00 UTC. During EDT this is 05:00 local.
    - cron: "0 9 * * *"

concurrency:
  group: b2-d1-daily-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install AWS CLI v2
        run: bash scripts/ci/install_aws_cli_v2.sh

      - name: Run B2 S3 Smoke Test
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: bash scripts/b2_s3_smoketest.sh

  sync:
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install AWS CLI v2
        run: bash scripts/ci/install_aws_cli_v2.sh

      - name: Verify Cloudflare D1 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/ci/verify_cloudflare_d1_auth.mjs

      - name: Run B2 → D1 incremental sync
        id: sync
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_EC2_METADATA_DISABLED: true
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: bash scripts/b2_d1_incremental_sync.sh

      - name: Reconcile photos rights from media_assets
        id: rights_reconcile
        env:
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          RECONCILE_MODE_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '--confirm' }}
        run: |
          node --experimental-strip-types scripts/ops/reconcile-photos-rights-from-media-assets.mjs \
            "$RECONCILE_MODE_FLAG" --database "${D1_DATABASE_NAME:-lgfc_lite}" --remote

      - name: Run B2 → D1 deletion reconciliation
        id: reconcile
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_EC2_METADATA_DISABLED: true
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: bash scripts/b2_d1_deletion_reconcile.sh

      - name: Open findings issue when reconcile has actionable results
        if: success() && steps.reconcile.outputs.has_findings == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_FINDINGS_WORKFLOW: OPS — B2 D1 Daily Sync
          OPS_FINDINGS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPS_FINDINGS_RETIRED_COUNT: ${{ steps.reconcile.outputs.retired_count }}
          OPS_FINDINGS_REPAIRED_MATCHUPS: ${{ steps.reconcile.outputs.repaired_matchups }}
          OPS_FINDINGS_MEDIA_RETIRED_COUNT: ${{ steps.reconcile.outputs.media_assets_retired_count }}
          OPS_FINDINGS_HAS_FINDINGS: ${{ steps.reconcile.outputs.has_findings }}
          OPS_FINDINGS_STALE_KEY_SAMPLE: ${{ steps.reconcile.outputs.stale_key_sample }}
          OPS_FINDINGS_LABELS: ops-runtime-finding,b2-runtime,d1-runtime
        run: node scripts/ci/ops_reconcile_findings.mjs

      - name: Write runtime step summary
        if: always()
        run: |
          {
            echo "## OPS — B2 D1 Daily Sync"
            echo "- Sync result: ${{ steps.sync.outcome }}"
            echo "- Deletion reconciliation: ${{ steps.reconcile.outcome }}"
            echo "- Soft-retired rows: ${{ steps.reconcile.outputs.retired_count }}"
            echo "- Active matchups repaired: ${{ steps.reconcile.outputs.repaired_matchups }}"
            echo "- Soft-retired content_items rows: ${{ steps.reconcile.outputs.media_assets_retired_count }}"
            echo "- Actionable findings: ${{ steps.reconcile.outputs.has_findings }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Escalate runtime failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_ESCALATION_WORKFLOW: OPS — B2 D1 Daily Sync
          OPS_ESCALATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPS_ESCALATION_DETAILS: B2 to D1 sync/reconciliation failed. Review scripts/b2_d1_incremental_sync.sh and scripts/b2_d1_deletion_reconcile.sh output and Cloudflare/B2 credentials.
          OPS_ESCALATION_LABELS: ops-runtime-failure,b2-runtime,d1-runtime
        run: node scripts/ci/ops_runtime_escalation.mjs

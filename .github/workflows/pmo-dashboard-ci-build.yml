name: PMO dashboard CI build

on:
  workflow_dispatch:
  schedule:
    # Freshness floor: Pages lag at most ~30 minutes unless manually dispatched.
    - cron: "*/30 * * * *"
  push:
    paths:
      - ".github/workflows/pmo-dashboard-ci-build.yml"
      - "scripts/pmo-dashboard/**"
      - "site/pmo-dashboard/**"
      - "docs/how-to/pmo/pmo-dashboard.md"

permissions:
  contents: read
  issues: read

env:
  PMO_DASHBOARD_OUT_DIR: site/pmo-dashboard

concurrency:
  group: pmo-dashboard-build-${{ github.repository }}
  cancel-in-progress: true

jobs:
  branch-validation:
    name: Validate PMO dashboard branch changes
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic dashboard fixture
        run: node scripts/pmo-dashboard/test-label-driven-fixture.mjs

      - name: Verify current repository and owner contract
        run: node scripts/pmo-dashboard/test-current-repository-contract.mjs

      - name: Write branch validation summary
        run: |
          echo "## PMO dashboard branch validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Deterministic fixture generation, current-repository identity, owner precedence, and validation passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Live issue inventory validation runs on main, scheduled, and manual operational events only (no issue-event triggers)." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build PMO dashboard
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pmo-dashboard/run-dashboard-build.mjs

      - name: Validate dashboard
        run: node scripts/pmo-dashboard/validate-dashboard.mjs "$PMO_DASHBOARD_OUT_DIR"

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmo-dashboard
          path: ${{ env.PMO_DASHBOARD_OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Write build summary
        run: |
          echo "## PMO dashboard CI build" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated live GitHub issue inventory output at \`$PMO_DASHBOARD_OUT_DIR/\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Publish path: deploy workflow consumes this artifact via workflow_run (no issue-event fan-out)." >> "$GITHUB_STEP_SUMMARY"

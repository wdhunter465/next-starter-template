name: OPS — Sync B2 secrets to Cloudflare Pages (#5131)

# Copies B2_ENDPOINT, B2_BUCKET, B2_KEY_ID and B2_APP_KEY from this repository's Actions
# secrets (the pair the daily b2-s3-smoke-test uses) into Cloudflare Pages secrets, so the
# Pages Functions can sign image links for the private B2 bucket.
# Uses existing repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_PROJECT_NAME. Never prints a key or a secret.
# Dry run by default; apply=true writes (Product Authority Go on #5131).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the secrets to Pages (default false = dry run, writes nothing)
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_environment:
        description: Cloudflare Pages environment
        required: false
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'preview'
      trigger_redeploy:
        description: Retry the latest deployment of that environment so the secrets apply (only with apply=true)
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      APPLY: ${{ inputs.apply }}
      B2_TARGET_ENV: ${{ inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard secrets are present
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID B2_ENDPOINT B2_BUCKET B2_KEY_ID B2_APP_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing repo secret: ${name}"
              exit 1
            fi
          done
          echo "Required repo secrets are present (values not logged)."

      - name: Validate, compare with Pages, and write when apply=true
        run: node scripts/ops/sync-b2-secrets-to-pages.mjs

      - name: Redeploy so the secrets apply
        if: ${{ inputs.apply == 'true' && inputs.trigger_redeploy == 'true' }}
        run: |
          set -euo pipefail
          PROJECT="${CLOUDFLARE_PROJECT_NAME:-next-starter-template}"
          TARGET="${{ inputs.target_environment }}"
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments?per_page=20"
          resp=$(curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json" "$url")
          dep=$(printf '%s' "$resp" | TARGET="$TARGET" node -e '
            let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
              const j=JSON.parse(d); const list=j.result||[];
              const match=list.find(x=>x.environment===process.env.TARGET);
              if(!match){ console.error("FAIL-CLOSED: no deployment found for " + process.env.TARGET); process.exit(2); }
              console.log(match.id);
            });
          ')
          echo "Retrying ${TARGET} deployment ${dep}…"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments/${dep}/retry" \
            >/dev/null
          for i in $(seq 1 18); do
            sleep 20
            status=$(curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments/${dep}" \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const j=JSON.parse(d);console.log(j.result?.latest_stage?.status||"")})')
            echo "Attempt $i status=${status}"
            [ "$status" = "success" ] && break
          done

      - name: Verify signed and unsigned image links (production only)
        if: ${{ inputs.apply == 'true' && inputs.target_environment == 'production' }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5 6; do
            J=$(curl -s -m 30 "https://www.lougehrigfanclub.com/api/photos/list?limit=100")
            U=$(printf '%s' "$J" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const a=JSON.parse(d).items||[];const x=a.find(i=>(i.url||"").includes("X-Amz-Signature"));console.log(x?x.url:"")}catch{console.log("")}})')
            [ -n "$U" ] && break
            sleep 20
          done
          if [ -z "$U" ]; then echo "No signed link returned yet."; exit 1; fi
          echo "signed link HTTP $(curl -s -m 30 -o /dev/null -w '%{http_code}' "$U")"
          echo "unsigned address HTTP $(curl -s -m 30 -o /dev/null -w '%{http_code}' "${U%%\?*}")"

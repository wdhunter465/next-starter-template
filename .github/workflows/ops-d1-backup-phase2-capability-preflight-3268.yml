name: OPS — D1 Backup Phase 2 Package 1 Capability Preflight (#3268)

# Operator-triggered, bounded, reversible capability preflight for #3268 Phase 2
# Package 1. Proves two currently-unverified capabilities before any real
# export/upload/restore code is written:
#   1. R2 write scope: PUT/GET/DELETE round-trip on a single disposable test
#      object under a clearly-scoped test prefix in the existing private
#      lgfc-d1-backups bucket.
#   2. D1 admin scope: create a brand-new, uniquely-named D1 database, run a
#      trivial query against it, then delete it. This database is never
#      referenced in wrangler.toml and is deleted before the job ends
#      (including on failure, via a best-effort cleanup path).
#
# This workflow never reads or writes lgfc_lite (Production D1) or any of
# its data, and never runs a real D1 export, R2 backup upload, or restore.
#
# This file (and scripts/ci/d1_backup_phase2_capability_preflight_3268.mjs)
# matches this repo's protected-path patterns in scripts/ci/delivery_profile.mjs,
# so PRs touching it require Approval profile: protected-change-review.

on:
  workflow_dispatch:
    inputs:
      confirm_capability_preflight:
        description: 'Type "confirm" to run the #3268 Phase 2 Package 1 capability preflight'
        required: true
        type: string

concurrency:
  group: d1-backup-phase2-capability-preflight-3268
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm_capability_preflight }}" != "confirm" ]; then
            echo "confirm_capability_preflight must be exactly 'confirm' — refusing to run."
            exit 1
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run #3268 Phase 2 Package 1 capability preflight
        id: preflight
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/d1_backup_phase2_capability_preflight_3268.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-phase2-capability-preflight-3268-result
          path: |
            d1-backup-phase2-capability-preflight-3268-result.json
            d1-backup-phase2-capability-preflight-3268-result.md
          if-no-files-found: warn

      - name: Write step summary
        if: always() && hashFiles('d1-backup-phase2-capability-preflight-3268-result.md') != ''
        run: cat d1-backup-phase2-capability-preflight-3268-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record result on #3268
        if: always() && hashFiles('d1-backup-phase2-capability-preflight-3268-result.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3268 --body-file d1-backup-phase2-capability-preflight-3268-result.md

      - name: Record failure on #3268
        if: failure() && steps.checkout.outcome == 'success' && hashFiles('d1-backup-phase2-capability-preflight-3268-result.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 3268 --body "$(cat <<'EOF'
          <!-- d1-backup-phase2-capability-preflight-3268 -->
          ## #3268 Phase 2 Package 1 capability preflight — FAILED (fail-closed)

          The bounded, reversible R2/D1 capability preflight did not complete. No
          Production D1 read/write was attempted. See the workflow run logs and
          uploaded artifact (if any) for details.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

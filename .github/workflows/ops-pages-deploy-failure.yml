name: OPS — Pages Deploy Failure Alert

# #4689. A failed Cloudflare Pages check on the default branch opens one
# Operations Issue naming the commit and the run. A successful check opens
# nothing. D1 Migrations stays on ops-workflow-failure-exception-issues.yml.
#
# The workflow file must be on the default branch before GitHub will deliver
# check_suite events to it.

on:
  check_suite:
    types: [completed]

permissions:
  contents: read
  checks: read
  issues: write

concurrency:
  group: ops-pages-deploy-failure
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event.check_suite.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_suite.head_branch == github.event.repository.default_branch &&
      github.event.check_suite.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Open or update the exception Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUITE_ID: ${{ github.event.check_suite.id }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          HEAD_BRANCH: ${{ github.event.check_suite.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ops/pages-deploy-failure-alert.mjs
